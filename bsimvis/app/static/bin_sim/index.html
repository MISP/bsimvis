<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Similarity Diff</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/logo.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/ui_components.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/entity_renderer.js"></script>
    <script src="/js/code_renderer.js"></script>
    <script src="/js/previews.js"></script>
    <script src="/js/metadata.js"></script>
    <script src="/js/tags.js"></script>
    <script src="/js/context_menu.js"></script>
    <script src="/js/diff_queue.js"></script>
    <script src="/js/binary_similarity.js"></script>
    <style>
        #binary-similarity-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100vh;
            overflow: hidden;
        }

        /* Resizable layout overrides */
        .resizable-card {
            background: var(--card-bg) !important;
        }
        
        /* Tag styling fallback */
        .tag-filter-container { display: flex; gap: 5px; }
        .tag-filter-add {
            background: transparent; border: 1px dashed var(--subtle); 
            color: var(--text); padding: 2px 5px; border-radius: 4px; font-size: 0.7rem; cursor: text;
        }
    </style>
</head>

<body>
    <div id="sidebar-container"></div>
    <div id="binary-similarity-container"></div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof UI !== 'undefined' && UI.Sidebar) {
                UI.Sidebar.init('sidebar-container');
            }
            const restful = parseRestfulPath();
            const urlParams = new URLSearchParams(window.location.search);
            if (restful.collection) urlParams.set('collection', restful.collection);
            if (restful.md5) {
                urlParams.set('md5', restful.md5);
                urlParams.set('md5_a', restful.md5);
            }
            if (restful.md5_b) urlParams.set('md5_b', restful.md5_b);
            if (restful.coll_b) urlParams.set('coll_b', restful.coll_b);
            if (restful.pool) urlParams.set('pool_id', restful.pool);

            // Re-use the existing logic from binary_similarity.js
            if (typeof renderBinarySimilarityView === 'function') {
                renderBinarySimilarityView(urlParams);
            } else {
                console.error("renderBinarySimilarityView not found!");
            }
        });

        // Mock dashboard functions required by some shared scripts
        window.debouncedSearch = function(fn) { if(fn) fn(); };
        window.handleFilterKey = function(e, fn) { if(e.key === 'Enter' && fn) fn(); };
    </script>
</body>

</html>
