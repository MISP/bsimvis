<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Call Graph</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/logo.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/js/navigation.js"></script>
    <script src="/js/ui_components.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/entity_renderer.js"></script>
    <script src="/js/metadata.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/js/call_graph.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0f14;
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 !important;
            overflow: hidden;
        }

        #call-graph-view-container {
            flex: 1;
            min-height: 0;
            margin: 0;
            position: relative;
        }

        header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div id="sidebar-container"></div>
    <div id="notification-container" style="position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px;"></div>

    <main>
        <header>
            <div class="header-left">
                <button id="sidebar-toggle" onclick="toggleSidebar()" title="Toggle Sidebar" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:1.2rem; padding: 0 10px;">⟨</button>
                <div class="header-title">
                    <i class="fa-solid fa-sitemap"></i>
                    <span>File Call Graph</span>
                </div>
            </div>
        </header>

        <div id="call-graph-view-container">
            <div id="loader" style="display:flex; justify-content:center; align-items:center; height:100%; color:var(--subtle); font-size:1.2rem; flex-direction:column; gap:15px; background:#0d0f14;">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem; color:var(--accent);"></i>
                <span>Loading Graph...</span>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Sidebar
            if (typeof UI !== 'undefined' && UI.Sidebar) {
                UI.Sidebar.init('sidebar-container');
            }

            // Job Status Polling
            window.updateJobStatusIcon = async () => {
                try {
                    const res = await fetch('/api/jobs/stats');
                    if (!res.ok) return;
                    const stats = await res.json();
                    const loader = document.getElementById('nav-jobs-loader');
                    const icon = document.getElementById('nav-jobs-icon');
                    const navLink = document.getElementById('nav-jobs');

                    const isActive = stats.active_workers > 0 || stats.pending_jobs > 0;

                    if (loader && icon && navLink) {
                        if (isActive) {
                            loader.style.display = 'block';
                            icon.style.display = 'none';
                            navLink.title = `${stats.active_workers} active, ${stats.pending_jobs} pending jobs`;
                        } else {
                            loader.style.display = 'none';
                            icon.style.display = 'inline-block';
                            navLink.title = "Background Jobs";
                        }
                    }
                } catch (e) {}
            };
            window.updateJobStatusIcon();
            setInterval(window.updateJobStatusIcon, 10000);

            const restful = parseRestfulPath();
            const params = new URLSearchParams(window.location.search);
            if (restful.collection) params.set('collection', restful.collection);
            if (restful.md5) params.set('file_md5', restful.md5);
            
            const col = params.get('collection');
            if (col && typeof UI !== 'undefined' && UI.Sidebar) {
                const navItems = ['nav-batches', 'nav-files', 'nav-functions', 'nav-features-global', 'nav-function-similarity', 'nav-clusters', 'nav-bin-clusters', 'nav-binary-similarity', 'nav-chord-map'];
                navItems.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'flex';
                });
                
                // Update collection name in sidebar
                const nameDisplay = document.getElementById('current-collection-name');
                if (nameDisplay) nameDisplay.innerText = col;
            }

            const containerId = 'call-graph-view-container';
            const cg = new FileCallGraph(containerId);
            window.callGraphInstance = cg;
            cg.fetch(params);

            // Handle window resize
            window.addEventListener('resize', () => {
                if (cg.simulation) {
                    cg.width = document.getElementById(containerId).clientWidth;
                    cg.height = document.getElementById(containerId).clientHeight;
                }
            });
        });
    </script>
</body>

</html>
