<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Features Browser</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/logo.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/js/navigation.js"></script>
    <script src="/js/ui_components.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/entity_renderer.js"></script>
    <script src="/js/code_renderer.js"></script>
    <script src="/js/metadata.js"></script>
    <script src="/js/diff_queue.js"></script>
    <script src="/js/table_selection.js"></script>
    <style>
        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .header h1 {
            color: var(--accent);
            margin: 0;
            font-size: 1.2rem;
        }

        .feature-table-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        th {
            background: #000;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            padding: 8px 12px;
            text-align: left;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        tr:hover {
            background: var(--hover);
        }

        .hash-badge {
            font-family: 'Consolas', monospace;
            color: #ae81ff;
            background: rgba(174, 129, 255, 0.1);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 0.75rem;
        }

        .hash-badge:hover {
            background: rgba(174, 129, 255, 0.3);
            border: 1px solid #ae81ff;
            color: #fff;
        }

        .type-badge {
            color: var(--accent);
            font-weight: bold;
            font-size: 0.7rem;
        }

        .pcode-badge {
            background: #f92672;
            color: #000;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-family: monospace;
        }

        .pcode-cell {
            color: var(--subtle);
            font-family: 'Consolas', monospace;
            font-size: 0.7rem;
            max-width: 250px;
            word-break: break-all;
        }

        .code-cell {
            background: var(--card-bg);
            /* Monokai Code */
            padding: 5px !important;
            border-radius: 4px;
        }

        .token-variable {
            color: #f92672;
        }

        .token-func_call {
            color: #66d9ef;
        }

        .token-type {
            color: #ae81ff;
        }

        .token-keyword {
            color: #f92672;
        }

        .token-comment {
            color: #75715e;
        }

        .token-string {
            color: #e6db74;
        }

        .token-number {
            color: #ae81ff;
        }

        .loader {
            text-align: center;
            padding: 30px;
            font-size: 1rem;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div id="sidebar-container"></div>
    <main style="flex:1; display:flex; flex-direction:column; overflow:hidden; padding: 15px;">
    <div class="container">
        <div class="header">
            <div>
                <h1>Features for Function: <span id="func-id" style="color:var(--accent)">...</span></h1>
                <div id="feature-count" class="dim">0 features</div>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <div id="diff-queue-status" style="display:flex; align-items:center; gap:10px;"></div>
                <button class="btn-code-action"
                    onclick="const parts = window.featureId.split(':'); window.open(`/collection/${encodeURIComponent(parts[0])}/function/${encodeURIComponent(parts[2])}/${encodeURIComponent(parts[3])}`, '_self')">
                    <span>↗</span> Code
                </button>
                <button id="add-diff-btn" class="btn-diff-action" data-full-text="true"
                    onmouseenter="if(window.featureId) onHoverDiffButton(event, window.featureId, window.featureName)"
                    onmouseleave="hideDiffPreview(event)"
                    onmousemove="if(window.moveDiffPreview) moveDiffPreview(event)"
                    onclick="if(window.featureId) addToDiff(window.featureId, window.featureName)">
                    <span>±</span> Add to Diff
                </button>
                <button class="btn-sim-action" onclick="seeSimilar(window.featureId)">
                    <i class="fa-solid fa-code-compare"></i> See Similar
                </button>
            </div>
        </div>

        <div class="feature-table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 110px;">Hash</th>
                        <th style="width: 110px;">Sequence</th>
                        <th style="width: 80px;">Type</th>
                        <th style="width: 140px;">PCode Op</th>
                        <th style="width: 180px;">PCode</th>
                        <th style="width: 220px;">PCode Context</th>
                        <th style="width: 40px;">TF</th>
                        <th>Source Context</th>
                    </tr>
                </thead>
                <tbody id="features-body">
                    <tr>
                        <td colspan="6" class="loader">Loading features...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="bsim-tooltip"></div>
    <script>
        const API_URL = "/api/function/features";
        const restful = parseRestfulPath();
        const params = new URLSearchParams(window.location.search);
        const id = normalizeFuncId(restful.id || params.get('id'));
        window.featureId = id;
        const tooltipEl = document.getElementById('bsim-tooltip');
        window.globalTips = {};

        if (id) {
            document.getElementById('func-id').innerText = id;
            loadFeatures();
        }

        async function loadFeatures() {
            try {
                const res = await fetch(`/api/function/features?id=${encodeURIComponent(id)}`);
                const data = await res.json();
                window.globalTips = data.tips || {};

                // Determine function name for diff display
                let name = id.split(':').pop();
                if (data.features && data.features.length > 0) {
                    // Try to get name from the first feature's context if available, 
                    // though usually the ID parts are more reliable.
                }
                window.featureName = name;

                renderFeatures(data.features || []);
                const addBtn = document.getElementById('add-diff-btn');
                if (addBtn && id) addBtn.dataset.funcId = id;
                updateDiffQueueUI();
                document.getElementById('feature-count').innerText = `${data.features ? data.features.length : 0} features`;
            } catch (err) {
                document.getElementById('features-body').innerHTML = `<tr><td colspan="6" style="color:var(--accent); padding:20px;">Error: ${err.message}</td></tr>`;
            }
        }

        function handleHoverMove(e, show) {
            if (!show) {
                tooltipEl.style.display = 'none';
                return;
            }
            const token = e.target.closest('.feature-highlight');
            if (!token) return;

            const idx = token.dataset.idx;
            const data = window.globalTips[idx];
            if (!data) return;

            let html = `<div style="font-weight:bold; color:var(--accent); border-bottom:1px solid #333; padding-bottom:5px; margin-bottom:5px;">Features (${data[1]})</div>`;

            data[2].forEach(f => {
                const color = f[8] || 'var(--accent)';
                html += `<div style="margin-bottom:8px;">
                    <div style="font-family:monospace; color:${color}; font-weight:bold;">${f[0]}</div>
                    <div style="font-size:0.7rem; color:var(--subtle);">${f[3]} | Op: ${f[1]} | <b style="color:var(--success)">TF: ${f[7] || 0}</b></div>
                </div>`;
            });

            tooltipEl.innerHTML = html;
            tooltipEl.style.display = 'block';
            tooltipEl.style.left = (e.clientX + 15) + "px";
            tooltipEl.style.top = (e.clientY + 15) + "px";

            const rect = tooltipEl.getBoundingClientRect();
            if (rect.right > window.innerWidth) tooltipEl.style.left = (e.clientX - rect.width - 15) + "px";
            if (rect.bottom > window.innerHeight) tooltipEl.style.top = (e.clientY - rect.height - 15) + "px";
        }

        document.addEventListener('mousemove', e => {
            if (tooltipEl.style.display === 'block') {
                const x = e.clientX + 15;
                const y = e.clientY + 15;
                tooltipEl.style.left = x + "px";
                tooltipEl.style.top = y + "px";

                const rect = tooltipEl.getBoundingClientRect();
                if (rect.right > window.innerWidth) tooltipEl.style.left = (e.clientX - rect.width - 15) + "px";
                if (rect.bottom > window.innerHeight) tooltipEl.style.top = (e.clientY - rect.height - 15) + "px";
            }
        });

        function renderFeatures(features) {
            const body = document.getElementById('features-body');
            body.innerHTML = '';
            window.featureMeta = {};

            if (features.length === 0) {
                body.innerHTML = '<tr><td colspan="6" class="dim" style="padding:20px;">No features found.</td></tr>';
                return;
            }

            features.forEach(f => {
                window.featureMeta[f.hash] = {
                    type: f.type || 'N/A',
                    op: f['pcode_op'] || 'N/A',
                    tf: f.tf || 0
                };
                const tr = document.createElement('tr');

                // Code Context
                let codeHtml = '<div class="dim">---</div>';
                if (f.context_lines && f.context_lines.length > 0) {
                    codeHtml = '';
                    f.context_lines.forEach(row => {
                        let rowHtml = `<div class="code-line" style="height:auto; line-height:1.3; font-size:0.75rem;">
                            <div class="gutter" style="min-width:30px; background:transparent; border:none; opacity:0.3;"><div class="line-num" style="width:20px; font-size:0.65rem; text-align:right;">${row.line_idx}</div></div>
                            <div class="line-content" style="padding-left:8px;">`;

                        row.tokens.forEach(t => {
                            rowHtml += renderTokenHtml(t);
                        });

                        rowHtml += `</div></div>`;
                        codeHtml += rowHtml;
                    });
                }
                const currentCollection = params.get('collection') || (window.parent && window.parent.getCollectionFromId ? window.parent.getCollectionFromId(id) : id.split(':')[0]);
                tr.innerHTML = `
                    <td>
                        <div style="display:inline-flex; align-items:center; gap:5px;">
                            <a href="#" onclick="event.preventDefault(); (window.Nav || window.parent.Nav).openPath((window.Nav || window.parent.Nav).buildUIUrl('${currentCollection.replace(/'/g, "\\'")}', ['feature', '${f.hash}']), event);" 
                            style="text-decoration: none;">
                                <span class="hash-badge" style="cursor: pointer;">${f.hash}</span>
                            </a>
                            <button class="btn-copy" title="Copy Feature ID: ${f['feature_id']}" onclick="copyToClipboard('${f['feature_id']}', this)">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </button>
                        </div>
                    </td>
                    <td><span class="mono" style="font-size:0.75rem; border:1px solid rgba(255,255,255,0.05); padding:1px 4px; border-radius:3px; background:rgba(255,255,255,0.02);">${f['seq'] || 'N/A'}</span></td>
                    <td><span class="type-badge" style="color:var(--accent); font-weight:bold; font-size:0.75rem;">${f.type || 'N/A'}</span></td>
                    <td>
                        <div style="display:inline-flex; flex-direction:column; gap:3px;">
                            ${f['previous_pcode_op'] ? `<span class="prev-badge" title="Previous Op">PREV: ${f['previous_pcode_op']}</span>` : ''}
                            <span class="pcode-badge">${f['pcode_op'] || 'N/A'}</span>
                            ${f['addr'] ? `<span class="addr-badge">${f['addr']}</span>` : ''}
                        </div>
                    </td>
                    <td class="pcode-cell">${f['pcode_op_full'] || 'N/A'}</td>
                    <td>
                        ${(f['pcode_block'] && Object.keys(f['pcode_block']).length > 0) ?
                        `<div class="pcode-block-container">
                                ${Object.entries(f['pcode_block']).map(([s, op]) => {
                            const isActive = (s === f['seq']);
                            const isPrevActive = (s === f['previous_seq']);
                            const cls = isActive ? 'active' : (isPrevActive ? 'prev-active' : '');
                            const addrPart = s.split(':')[0];
                            return `<div class="pcode-block-line ${cls}"><span class="pcode-block-seq">${addrPart}</span>${op.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</div>`;
                        }).join('')}
                            </div>` :
                        '<span class="dim">---</span>'
                    }
                    </td>
                    <td class="dim" style="font-size:0.75rem;">${f.tf || 'N/A'}</td>
                    <td class="code-cell">${codeHtml}</td>
                `;
                body.appendChild(tr);
            });
        }

        function showTokenContextMenu(e) {
            const token = e.target.closest('.feature-highlight');
            if (!token) return;
            e.preventDefault();

            const idx = token.dataset.idx;
            const data = window.globalTips[idx];
            if (!data || !data[2]) return;

            const collection = id.split(':')[0] || 'main';

            let menu = document.getElementById('token-context-menu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'token-context-menu';
                menu.className = 'context-menu';
                document.body.appendChild(menu);
            }

            let html = `<div class="context-menu-header">Select Feature to Analyze</div>`;
            data[2].forEach(f => {
                const hash = f[0], op = f[1], type = f[3], tf = f[7] || 0, color = f[8] || 'var(--accent)';
                html += `<div class="context-menu-item" data-hash="${hash}" data-col="${collection}">
                    <div class="context-menu-icon" style="color:${color}">🔍</div>
                    <div style="flex:1">
                        <div style="font-family:monospace; font-weight:bold; color:${color}">${hash}</div>
                        <div style="font-size:0.75rem; color:var(--subtle); margin-top:2px;">${type} | Op: ${op} | <b style="color:var(--success)">TF: ${tf}</b></div>
                    </div>
                </div>`;
            });

            menu.innerHTML = html;
            menu.style.display = 'block';
            let x = e.clientX, y = e.clientY;
            if (x + 350 > window.innerWidth) x -= 350;
            if (y + (data[2].length * 52 + 50) > window.innerHeight) y -= (data[2].length * 52 + 50);
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';

            const onMenuClick = (me) => {
                const item = me.target.closest('.context-menu-item');
                if (item) {
                    const h = item.dataset.hash;
                    const c = item.dataset.col;
                    if (window.parent && window.parent !== window && typeof window.parent.showGlobalFeaturePanel === 'function') {
                        window.parent.showGlobalFeaturePanel(h, c);
                    } else {
                        window.location.href = `/feature/index.html?hash=${encodeURIComponent(h)}&collection=${encodeURIComponent(c)}`;
                    }
                }
                closeMenu();
            };
            const closeMenu = () => {
                menu.style.display = 'none';
                menu.removeEventListener('click', onMenuClick);
                document.removeEventListener('mousedown', closeGlobal);
            };
            const closeGlobal = (me) => { if (!menu.contains(me.target)) closeMenu(); };
            setTimeout(() => {
                menu.addEventListener('click', onMenuClick);
                document.addEventListener('mousedown', closeGlobal);
            }, 10);
        }


        document.addEventListener('contextmenu', e => {
            if (e.target.closest('.feature-highlight')) {
                showTokenContextMenu(e);
            }
        });

        const featuresBody = document.getElementById('features-body');
        featuresBody.addEventListener('pointerover', e => handleHoverMove(e, true));
        featuresBody.addEventListener('pointerout', e => handleHoverMove(e, false));

        if (typeof UI !== 'undefined' && UI.Sidebar) {
            UI.Sidebar.init('sidebar-container');
        }

        updateDiffQueueUI();
    </script>
</main>
</body>

</html>
