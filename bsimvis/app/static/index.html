<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSimVis Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/logo.css">
    <script src="/js/navigation.js?v=3"></script>
    <script src="/js/ui_components.js?v=3"></script>
    <script src="/js/tags.js?v=3"></script>
    <script src="/js/notes.js?v=3"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <script src="/js/diff_queue.js?v=7"></script>
    <script src="/js/previews.js?v=3"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/js/d3_layouts.js?v=3"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/js/utils.js?v=7"></script>
    <script src="/js/entity_renderer.js?v=3"></script>
    <script src="/js/code_renderer.js?v=3"></script>
    <script src="/js/metadata.js?v=3"></script>
    <script src="/js/table_renderers.js?v=3"></script>
    <script src="/js/similarity_graph.js?v=3"></script>
    <script src="/js/cluster_views.js?v=3"></script>
    <script src="/js/bin_cluster_views.js?v=3"></script>
    <script src="/js/call_graph.js?v=3"></script>
    <script src="/js/binary_similarity.js?v=7"></script>
    <script src="/js/chord_graph.js?v=7"></script>
    <script src="/js/window_manager.js?v=3"></script>
    <script src="/js/upload.js?v=3"></script>
    <script src="/js/context_menu.js?v=7"></script>
    <script src="/js/dashboard.js?v=3"></script>
    <script src="/js/breadcrumbs.js?v=3"></script>
    <script src="/js/jobs.js?v=3"></script>
    <script src="/js/table_selection.js?v=3"></script>
    
    <!-- View Modules -->
    <script src="/js/views/function_view.js?v=3"></script>
    <script src="/js/views/file_view.js?v=3"></script>
    <script src="/js/views/diff_view.js?v=7"></script>
    <script src="/js/views/call_graph_view.js?v=3"></script>
    <script src="/js/views/feature_view.js?v=3"></script>
    <script src="/js/views/function_features_view.js?v=3"></script>
    <script src="/js/views/collection_detail_view.js?v=3"></script>
    <script src="/js/views/pool_detail_view.js?v=9"></script>
</head>

<body>

    <div id="sidebar-container"></div>

    <main id="main-content">
        <div id="breadcrumbs-container" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); margin-bottom: 15px; border-radius: 6px; gap: 15px; flex-wrap: wrap;">
            <div id="breadcrumbs-list"></div>
            <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                <span id="view-total" class="badge"
                    style="background:rgba(255,171,46,0.1); color:var(--accent); font-size:0.75rem; display:none; border:1px solid rgba(255,171,46,0.3)"></span>
                <span id="view-job-status" class="badge"
                    style="background:rgba(96,165,250,0.1); color:#60a5fa; font-size:0.75rem; display:none; border:1px solid rgba(96,165,250,0.3); align-items:center; gap:6px;"></span>
                <i id="pool-warn-icon" class="fa-solid fa-triangle-exclamation" style="color:#ffab2e; display:none; cursor:help; font-size: 0.9rem;" title="Pool Truncated"></i>
                <i id="limit-warn-icon" class="fa-solid fa-circle-info" style="color:#60a5fa; display:none; cursor:help; font-size: 0.9rem;" title="Result Limit Reached"></i>
                <div id="search-settings-container" style="display:none; align-items:center; gap:8px;"></div>
                <div id="header-top-actions" style="display:flex; gap:10px; align-items:center;">
                    <div id="diff-queue-status" style="font-size:0.8rem; color:var(--dim)"></div>
                    <div id="file-diff-queue-status" style="font-size:0.8rem; color:var(--dim)"></div>

                    <button id="header-rebuild-all-btn" onclick="triggerRebuildAll()" class="top-action-btn"
                        title="Rebuild Analysis" style="display:none; color:var(--accent); border-color:var(--accent);">
                        <i class="fa-solid fa-arrows-rotate" id="header-rebuild-all-icon"></i> Rebuild Analysis
                    </button>

                    <button onclick="refreshData(false, true)" class="top-action-btn" title="Refresh Data">
                        <i class="fa-solid fa-arrows-rotate" style="color:var(--accent);"></i> Refresh
                    </button>

                    <button id="header-clear-btn" onclick="clearFilters()" class="top-action-btn danger-btn" title="Clear All Filters">
                        <i class="fa-solid fa-trash-can"></i> Clear
                    </button>
                    <div id="header-history-btn-container" class="view-history-container" style="position:relative;">
                        <button id="view-history-btn" class="top-action-btn" title="View Search History">
                            <i class="fa-solid fa-clock-rotate-left"></i> History
                        </button>
                        <div id="view-history-dropdown" class="history-dropdown view-history-dropdown"
                            style="display:none;"></div>
                    </div>
                    <div class="export-dropdown-container" id="export-dropdown-container"
                        style="position:relative; display:none;">
                        <button id="export-btn" class="top-action-btn" title="Export Results"
                            onclick="toggleExportDropdown(event)">
                            <i class="fa-solid fa-download" style="color:var(--accent);"></i>
                        </button>
                        <div id="export-dropdown" class="history-dropdown view-history-dropdown"
                            style="display:none; width:155px; border-top-color:var(--accent); right:0; left:auto;">
                            <div class="history-dropdown-title" style="color:var(--accent);">Export Options</div>
                            <a href="#"
                                onclick="event.preventDefault(); downloadSearchResults('csv'); closeExportDropdown();"
                                class="history-item"
                                style="display:flex; align-items:center; text-decoration:none; color:var(--text); font-size:0.75rem; gap:8px;">
                                <i class="fa-solid fa-file-csv" style="color:#22c55e; font-size:0.9rem;"></i> Export as
                                CSV
                            </a>
                            <a href="#"
                                onclick="event.preventDefault(); downloadSearchResults('json'); closeExportDropdown();"
                                class="history-item"
                                style="display:flex; align-items:center; text-decoration:none; color:var(--text); font-size:0.75rem; gap:8px;">
                                <i class="fa-solid fa-file-code" style="color:#3b82f6; font-size:0.9rem;"></i> Export as
                                JSON
                            </a>
                        </div>
                    </div>
                    <button id="toggle-filters-btn" class="toggle-btn active" onclick="toggleFilters()"
                        title="Toggle Filters">
                        <i class="fa-solid fa-filter"></i> Filters
                    </button>
                    <button id="collapse-header-btn" class="toggle-btn active" onclick="toggleHeader()"
                        title="Toggle Search Area">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                    <button id="header-settings-btn" onclick="toggleUISettings()" class="top-action-btn" title="UI Settings">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>
        </div>
        <div id="dashboard-view-container" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
            <div class="header">
                <div class="header-top">
                    <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
                            <h1 id="view-title" style="margin:0; white-space:nowrap;">Dashboard</h1>
                    </div>
                    <div id="search-area" style="margin-left:auto; flex:1;"></div>
                </div>
            </div>

            <!-- UI Settings Panel -->
            <div id="ui-settings-panel"
                style="display:none; position:fixed; right:20px; top:60px; z-index:10000; width:300px; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h3 style="margin:0; font-size:1rem; color:var(--accent);">UI Settings</h3>
                    <button onclick="toggleUISettings()"
                        style="background:none; border:none; color:var(--dim); cursor:pointer;"><i
                            class="fa-solid fa-times"></i></button>
                </div>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom: 12px;">
                    <input type="checkbox" id="param-color-tags" onchange="updateUIParams()">
                    <label style="font-size:0.8rem;">Color by Tags</label>
                </div>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom: 20px;">
                    <input type="checkbox" id="param-include-headers" onchange="updateUIParams()">
                    <label style="font-size:0.8rem;">Include Headers in Copy</label>
                </div>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom: 20px;">
                    <input type="checkbox" id="param-use-floating-windows" onchange="updateUIParams()">
                    <label style="font-size:0.8rem;">Use Floating Windows</label>
                </div>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom: 20px;">
                    <input type="checkbox" id="param-light-theme" onchange="updateUIParams()">
                    <label style="font-size:0.8rem;">Light Theme</label>
                </div>

                <div style="border-top: 1px solid var(--border); padding-top: 15px;">
                    <button onclick="resetColumnWidths()" class="settings-panel-btn">
                        <i class="fa-solid fa-arrows-left-right"></i> Reset Column Widths
                    </button>
                </div>
            </div>

            <div id="grid-container" style="flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative;">
                <div id="grid-header" style="flex-shrink:0;"></div>
                <div id="grid-body" style="flex:1; overflow:hidden; display:flex; flex-direction:column; position:relative;">
                    
                    <div id="table-wrap" class="table-container">
                        <div class="table-header-wrap">
                            <table id="data-table-header">
                                <colgroup id="table-colgroup-header"></colgroup>
                                <thead id="table-head"></thead>
                            </table>
                        </div>
                        <div id="table-body-wrap" class="table-body-wrap">
                            <table id="data-table">
                                <colgroup id="table-colgroup"></colgroup>
                                <tbody id="table-body"></tbody>
                            </table>
                            <div id="pagination-container"></div>
                        </div>
                    </div>

                    <div id="loader" style="display:none;">
                        <i class="fa-solid fa-arrows-rotate fa-spin"></i> Loading...
                    </div>

                    <div id="graph-view-container" style="display: none; flex: 1; flex-direction: column; position: relative; min-height: 500px;">
                        <div id="bk-similarity-plot" style="flex: 1; width: 100%; height: 100%;"></div>
                        <div id="graph-loading-overlay">
                            <div class="spinner-graph"></div>
                            <div class="graph-loading-content">
                                <span id="graph-loading-text"></span>
                                <span id="graph-stream-info"></span>
                            </div>
                            <button id="graph-stop-btn" class="top-action-btn danger-btn" style="display:none; pointer-events: auto; margin-left: 10px; font-size: 0.75rem; padding: 4px 8px;">Stop</button>
                        </div>
                    </div>

                    <div id="hierarchy-view-container" style="display: none; flex: 1; min-height: 500px; position: relative;"></div>
                    <div id="packing-view-container" style="display: none; flex: 1; min-height: 500px; position: relative;"></div>
                    <div id="chord-view-container" style="display: none; flex: 1; min-height: 500px; position: relative;"></div>
                    <div id="upload-view-container" style="display: none; flex: 1; flex-direction: column; overflow-y: auto; overflow-x: hidden;"></div>
                    <div id="binary-density-view-container" style="display: none;"></div>

                </div>
            </div>
        </div>

        <div id="module-view-container" style="display: none; flex: 1; flex-direction: column; overflow: hidden; height: 100%;">
            <!-- Dynamic view modules injected here -->
        </div>
    </main>

    <div id="job-details-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="job-modal-title">Processing Jobs</h3>
                <span class="close" onclick="closeJobModal()">&times;</span>
            </div>
            <div id="job-modal-body" class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn-action" onclick="closeJobModal()">Close</button>
            </div>
        </div>
    </div>
</body>

</html>
