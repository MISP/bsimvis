        // --- Similarity Graph Logic (Single-Document Integration) ---
        window.simGraph = null;

        class SimilarityGraph {
            constructor(containerId) {
                this.containerId = containerId;
                this.mousePos = { clientX: 0, clientY: 0 };
                window.addEventListener('mousemove', e => {
                    this.mousePos.clientX = e.clientX;
                    this.mousePos.clientY = e.clientY;
                });
                this.abortController = null;
                this.all_pairs = [];
                this.nodes_map = new Map();
                this.unique_nodes = [];
                this.binary_md5s = new Set();
                this.plot = null;
                window.graphInstance = this;

                // 1. Initialize Data Sources
                this.seg_source = new Bokeh.ColumnDataSource({ data: { x0: [], y0: [], x1: [], y1: [], color: [], alpha: [], width: [] } });
                this.hit_source = new Bokeh.ColumnDataSource({ data: { xs: [], ys: [], f1: [], f2: [], b1: [], b2: [], score: [], c1: [], c2: [], s1: [], s2: [], id1: [], id2: [], fn1: [], fn2: [] } });
                this.node_source = new Bokeh.ColumnDataSource({ data: { x: [], y: [], name: [], addr: [], bin: [], color: [], v_size: [], id: [], snippet: [], file_name: [], return_type: [], tags: [] } });
                this.ring_source = new Bokeh.ColumnDataSource({ data: { start: [], end: [], color: [], name: [], md5: [], file_name: [], inner_r: [], outer_r: [], count: [] } });

                this.initPlot();
            }

            initPlot() {
                const container = document.getElementById(this.containerId);
                const width = container.clientWidth || 800;
                const height = container.clientHeight || 500;

                this.plot = Bokeh.Plotting.figure({
                    width: width, height: height,
                    match_aspect: true, toolbar_location: "above",
                    background_fill_color: "#121212", border_fill_color: "#121212",
                    active_scroll: "wheel_zoom"
                });
                this.plot.axis.visible = false;
                this.plot.grid.grid_line_color = null;

                // Glyphs
                const r_ring = this.plot.annular_wedge({ x: 0, y: 0, inner_radius: { field: 'inner_r' }, outer_radius: { field: 'outer_r' }, start_angle: { field: 'start' }, end_angle: { field: 'end' }, color: { field: 'color' }, alpha: 0.3, source: this.ring_source });
                this.plot.segment({ x0: { field: 'x0' }, y0: { field: 'y0' }, x1: { field: 'x1' }, y1: { field: 'y1' }, color: { field: 'color' }, line_alpha: { field: 'alpha' }, line_width: { field: 'width' }, source: this.seg_source });
                const r_links = this.plot.multi_line({ xs: { field: 'xs' }, ys: { field: 'ys' }, line_width: 15, line_alpha: 0, hover_line_alpha: 0.6, hover_line_color: "white", source: this.hit_source });
                const r_nodes = this.plot.circle({ x: { field: 'x' }, y: { field: 'y' }, size: 11, color: { field: 'color' }, line_color: "white", source: this.node_source });

                // Hover Tools (No native tooltips)
                const h_bin = new Bokeh.HoverTool({ renderers: [r_ring], tooltips: null });
                const h_links = new Bokeh.HoverTool({ renderers: [r_links], tooltips: null });
                const h_nodes = new Bokeh.HoverTool({ renderers: [r_nodes], tooltips: null });
                h_bin.callback = new Bokeh.CustomJS({
                    args: { source: this.ring_source },
                    code: `
                        const indices = cb_data.index.indices;
                        if (indices.length > 0 && !window.graphContextMenuOpen) {
                            const name = source.data.name[indices[0]];
                            const md5 = source.data.md5[indices[0]];
                            const file_name = source.data.file_name[indices[0]];
                            const count = source.data.count[indices[0]];
                            const language = source.data.language[indices[0]];
                            const tags = source.data.tags[indices[0]];
                            const rect = document.getElementById('bk-similarity-plot').getBoundingClientRect();
                            const e = { clientX: cb_data.geometry.vx + rect.left, clientY: cb_data.geometry.vy + rect.top };
                            if (window.showBinaryPreview) window.showBinaryPreview(md5, file_name || name, count, language, tags, e);
                        } else {
                            if (window.hideBinaryPreview) window.hideBinaryPreview();
                        }
                    `
                });

                h_links.callback = new Bokeh.CustomJS({
                    args: { source: this.hit_source },
                    code: `
                        const indices = cb_data.index.indices;
                        window.lastGraphLinkIndices = indices;
                        if (indices.length > 0 && !window.graphNodeHovered && !window.graphContextMenuOpen) {
                            const id1 = source.data.id1[indices[0]];
                            const id2 = source.data.id2[indices[0]];
                            const n1 = source.data.f1[indices[0]];
                            const n2 = source.data.f2[indices[0]];
                            const score = source.data.score[indices[0]];
                            const extra = indices.length - 1;
                            const rect = document.getElementById('bk-similarity-plot').getBoundingClientRect();
                            const e = { clientX: cb_data.geometry.vx + rect.left, clientY: cb_data.geometry.vy + rect.top };
                            if (window.showDiffPreview) window.showDiffPreview(id1, n1, id2, n2, score, e, extra);
                        } else {
                            if (window.hideDiffPreview) window.hideDiffPreview();
                        }
                    `
                });

                h_nodes.callback = new Bokeh.CustomJS({
                    args: { source: this.node_source },
                    code: `
                        const indices = cb_data.index.indices;
                        window.lastGraphNodeIndices = indices;
                        if (indices.length > 0 && !window.graphContextMenuOpen) {
                            window.graphNodeHovered = true;
                            const id = source.data.id[indices[0]];
                            const name = source.data.name[indices[0]];
                            const addr = source.data.addr[indices[0]];
                            const bin = source.data.bin[indices[0]];
                            const file_name = source.data.file_name[indices[0]];
                            const v_size = source.data.v_size[indices[0]];
                            const extra = indices.length - 1;
                            const rect = document.getElementById('bk-similarity-plot').getBoundingClientRect();
                            const e = { clientX: cb_data.geometry.vx + rect.left, clientY: cb_data.geometry.vy + rect.top };
                            if (window.showCodePreview) window.showCodePreview(id, name, addr, bin, v_size, e, extra, file_name);
                        } else {
                            window.graphNodeHovered = false;
                            if (window.hideCodePreview) window.hideCodePreview();
                        }
                    `
                });

                this.plot.add_tools(h_bin, h_links, h_nodes, new Bokeh.TapTool({ renderers: [r_links, r_nodes] }));
                this.plot.toolbar.active_inspect = [h_bin, h_links, h_nodes];

                // Tap Logic (direct call)
                const onSelect = () => {
                    const node_inds = this.node_source.selected.indices;
                    const hit_inds = this.hit_source.selected.indices;

                    if (this.node_source.data.id && node_inds.length > 0) {
                        const id = this.node_source.data.id[node_inds[0]];
                        const name = this.node_source.data.name[node_inds[0]];
                        window.showFunctionCodeById(id, name);
                        this.node_source.selected.indices = [];
                    } else if (hit_inds.length > 0) {
                        const id1 = this.hit_source.data.id1[hit_inds[0]]; const id2 = this.hit_source.data.id2[hit_inds[0]];
                        const name1 = this.hit_source.data.f1[hit_inds[0]]; const name2 = this.hit_source.data.f2[hit_inds[0]];
                        window.openDiffDirectly(id1, name1, id2, name2);
                        this.hit_source.selected.indices = [];
                    }
                };
                this.node_source.selected.properties.indices.change.connect(onSelect.bind(this));
                this.hit_source.selected.properties.indices.change.connect(onSelect.bind(this));

                Bokeh.Plotting.show(this.plot, `#${this.containerId}`);
            }

            getRingTooltip() {
                return `<div style="padding:12px; background:#1A1A1A; color:#FFF; border:2px solid @color; border-radius:8px; min-width:200px;">
                    <div style="font-size:14px; font-weight:bold; margin-bottom:4px; color:@color;">@file_name (BINARY)</div>
                    <div style="font-size:11px; color:#AAA; margin-bottom:8px;">MD5: @md5</div>
                    <div style="display:flex; justify-content:space-between; font-size:12px; border-top:1px solid #333; padding-top:8px;">
                        <span>Functions in Graph:</span>
                        <span style="font-weight:bold; color:#ff79c6;">@count</span>
                    </div>
                </div>`;
            }

            getLinkTooltip() {
                return `<div style="padding:12px; background:#121212; color:#D4D4D4; border:1px solid #444; border-radius:8px; width:340px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span style="color:#A6E22E; font-weight:bold; font-size:16px;">@score MATCH</span>
                        <span style="font-size:10px; color:#777;">Pair Summary</span>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                        <div style="background:#1A1A1A; padding:6px; border-radius:4px; border-left:3px solid @c1;">
                            <div style="font-size:10px; font-weight:bold; color:#AAA; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;" title="@fn1">@f1</div>
                            <div style="font-size:8px; color:#777; overflow:hidden; text-overflow:ellipsis;">@fn1</div>
                        </div>
                        <div style="background:#1A1A1A; padding:6px; border-radius:4px; border-left:3px solid @c2;">
                            <div style="font-size:10px; font-weight:bold; color:#AAA; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;" title="@fn2">@f2</div>
                            <div style="font-size:8px; color:#777; overflow:hidden; text-overflow:ellipsis;">@fn2</div>
                        </div>
                    </div>
                </div>`;
            }

            getNodeTooltip() {
                return `<div style="padding:12px; background:#1A1A1A; color:#D4D4D4; border:2px solid @color; border-radius:8px; width:280px;">
                    <div style="font-size:13px; font-weight:bold; margin-bottom:2px; color:@color;">@name</div>
                    <div style="font-size:11px; color:#AAA; margin-bottom:4px; font-style:italic;">@file_name</div>
                    <div style="font-size:10px; color:#AAA; margin-bottom:8px;">Addr: @addr | Features: @v_size | @return_type</div>
                </div>`;
            }

            stop() { if (this.abortController) this.abortController.abort(); }

            async fetch(params) {
                if (this.abortController) this.abortController.abort();
                this.abortController = new AbortController();
                const signal = this.abortController.signal;

                this.all_pairs = []; this.nodes_map.clear(); this.unique_nodes = []; this.binary_md5s.clear();

                const overlay = document.getElementById('graph-loading-overlay');
                const streamInfo = document.getElementById('graph-stream-info');
                const loadingText = document.getElementById('graph-loading-text');
                const stopBtn = document.getElementById('graph-stop-btn');
                const MAX_TOTAL = parseInt(params.get('limit')) || DEFAULT_GRAPH_LIMIT;

                overlay.style.display = 'flex';
                loadingText.innerText = "Building Similarity Map...";
                streamInfo.innerText = "";
                stopBtn.style.display = 'inline-block';

                // Clone and clean params to avoid duplicates in loop (like &offset=0&offset=500)
                const cleanParams = new URLSearchParams(params.toString());
                cleanParams.delete('limit');
                cleanParams.delete('offset');
                const base_url = `/api/similarity/search?${cleanParams.toString()}`;
                let currentOffset = 0;

                // Clear the graph immediately
                this.updateSources(params);

                try {
                    while (currentOffset < MAX_TOTAL && !signal.aborted) {
                        const BATCH_SIZE = Math.min(MAX_TOTAL - this.all_pairs.length, 500);
                        if (BATCH_SIZE <= 0) break;

                        const res = await fetch(`${base_url}&limit=${BATCH_SIZE}&offset=${currentOffset}`, { signal });
                        const data = await res.json();

                        // Handle truncation and limit alerts next to inputs
                        const poolIcon = document.getElementById('pool-warn-icon');
                        const limitIcon = document.getElementById('limit-warn-icon');
                        const poolInput = document.getElementById('sim-pool-limit');
                        const limitInput = document.getElementById('sim-limit');
                        const totalEl = document.getElementById('view-total');

                        if (poolIcon) {
                            if (data.pool_truncated) {
                                poolIcon.style.display = 'inline-block';
                                poolIcon.title = `⚠️ Pool Truncated to first ${data.pool_limit || '---'} matches. Results may be incomplete.`;
                                if (poolInput) poolInput.style.borderColor = '#ffab2e';
                            } else {
                                poolIcon.style.display = 'none';
                                if (poolInput) poolInput.style.borderColor = 'var(--accent)';
                            }
                        }

                        const pairs = data.pairs || [];
                        if (pairs.length === 0) break;

                        this.all_pairs = this.all_pairs.concat(pairs);

                        if (limitIcon) {
                            if (this.all_pairs.length >= MAX_TOTAL) {
                                limitIcon.style.display = 'inline-block';
                                limitIcon.title = `ℹ️ Result Limit Reached (${MAX_TOTAL.toLocaleString()}). Map display is capped.`;
                                if (limitInput) limitInput.style.borderColor = '#60a5fa';
                            } else {
                                limitIcon.style.display = 'none';
                                if (limitInput) limitInput.style.borderColor = 'var(--accent)';
                            }
                        }

                        if (totalEl) {
                            totalEl.style.display = 'inline-block';
                            totalEl.innerText = `${this.all_pairs.length.toLocaleString()} / ${(data.total || 0).toLocaleString()}`;
                        }
                        pairs.forEach(p => {
                            [{ id: p.id1, name: p.name1, meta: p.meta1 }, { id: p.id2, name: p.name2, meta: p.meta2 }].forEach(n => {
                                if (!this.nodes_map.has(n.id)) {
                                    const node_obj = {
                                        id: n.id, name: n.name, md5: n.meta.file_md5,
                                        file_name: n.meta.file_name, return_type: n.meta.return_type,
                                        addr: n.id.split(':').pop(), v_size: n.meta.bsim_features_count,
                                        language_id: n.meta.language_id || 'N/A',
                                        tags: n.meta.tags || []
                                    };
                                    this.nodes_map.set(n.id, node_obj); this.unique_nodes.push(node_obj); this.binary_md5s.add(n.meta.file_md5);
                                }
                            });
                        });

                        this.updateSources(params);
                        streamInfo.innerText = `Streamed ${this.all_pairs.length} matches...`;
                        currentOffset += BATCH_SIZE;
                        if (pairs.length < BATCH_SIZE) break;
                    }
                } catch (e) { if (e.name !== 'AbortError') console.error(e); }
                finally {
                    overlay.style.display = 'none';
                    stopBtn.style.display = 'none';
                }
            }

            updateSources(params) {
                if (this.all_pairs.length === 0) {
                    this.node_source.data = { x: [], y: [], name: [], addr: [], bin: [], color: [], v_size: [], id: [], file_name: [], return_type: [], tags: [] };
                    this.seg_source.data = { x0: [], y0: [], x1: [], y1: [], color: [], alpha: [], width: [] };
                    this.hit_source.data = { xs: [], ys: [], f1: [], f2: [], b1: [], b2: [], score: [], c1: [], c2: [], id1: [], id2: [], fn1: [], fn2: [] };
                    this.ring_source.data = { start: [], end: [], color: [], name: [], md5: [], file_name: [], inner_r: [], outer_r: [], count: [] };
                    return;
                }

                this.unique_nodes.sort((a, b) => a.md5.localeCompare(b.md5) || a.name.localeCompare(b.name));
                const n_active = this.unique_nodes.length;
                const theta_step = (2 * Math.PI) / n_active;
                const derived_r = Math.max(2.5, 0.3 / theta_step);
                const ring_inner = derived_r + 0.3; const ring_outer = derived_r + 1.8;

                const id_to_info = new Map();
                this.unique_nodes.forEach((n, i) => {
                    const angle = i * theta_step;
                    id_to_info.set(n.id, { ...n, x: derived_r * Math.cos(angle), y: derived_r * Math.sin(angle), angle: angle });
                });

                const palette = ["#1f77b4", "#aec7e8", "#ff7f0e", "#ffbb78", "#2ca02c", "#98df8a", "#d62728", "#ff9896", "#9467bd", "#c5b0d5", "#8c564b", "#c49c94", "#e377c2", "#f7b6d2", "#7f7f7f", "#c7c7c7", "#bcbd22", "#dbdb8d", "#17becf", "#9edae5"];
                const bin_list = Array.from(this.binary_md5s).sort();
                const bin_colors = new Map(bin_list.map((md5, i) => [md5, palette[i % 20]]));

                const ns = { x: [], y: [], name: [], addr: [], bin: [], color: [], v_size: [], id: [], file_name: [], return_type: [] };
                this.unique_nodes.forEach(n => {
                    const info = id_to_info.get(n.id);
                    ns.x.push(info.x); ns.y.push(info.y); ns.name.push(n.name); ns.addr.push(n.addr);
                    ns.bin.push(n.md5.slice(0, 8)); ns.color.push(bin_colors.get(n.md5));
                    ns.v_size.push(n.v_size); ns.id.push(n.id);
                    ns.file_name.push(n.file_name || ''); ns.return_type.push(n.return_type || 'N/A');
                });

                const ss = { x0: [], y0: [], x1: [], y1: [], color: [], alpha: [], width: [] };
                const hs = { xs: [], ys: [], f1: [], f2: [], b1: [], b2: [], score: [], c1: [], c2: [], id1: [], id2: [], fn1: [], fn2: [] };
                const minScoreParam = params.get('min_score');
                const minScore = (minScoreParam !== null && minScoreParam !== "") ? parseFloat(minScoreParam) : 0.95;

                this.all_pairs.forEach(p => {
                    const n1 = id_to_info.get(p.id1); const n2 = id_to_info.get(p.id2);
                    if (!n1 || !n2) return;
                    const t_vals = []; for (let i = 0; i <= 1; i += 1 / 15) t_vals.push(i);
                    const curve = t_vals.map(t => {
                        const it = 1 - t;
                        return { x: it * it * n1.x + 2 * it * t * 0 + t * t * n2.x, y: it * it * n1.y + 2 * it * t * 0 + t * t * n2.y };
                    });
                    const col1 = bin_colors.get(n1.md5); const col2 = bin_colors.get(n2.md5);
                    const norm = (p.score - minScore) / (1.0 - minScore + 0.0001);
                    for (let k = 0; k < curve.length - 1; k++) {
                        ss.x0.push(curve[k].x); ss.y0.push(curve[k].y); ss.x1.push(curve[k + 1].x); ss.y1.push(curve[k + 1].y);
                        ss.color.push(this.blendHex(col1, col2, t_vals[k])); ss.alpha.push(0.1 + (norm * 0.7)); ss.width.push(0.5 + (norm * 6));
                    }
                    hs.xs.push(curve.map(v => v.x)); hs.ys.push(curve.map(v => v.y));
                    hs.f1.push(p.name1); hs.f2.push(p.name2); hs.b1.push(n1.md5.slice(0, 8)); hs.b2.push(n2.md5.slice(0, 8));
                    hs.score.push(p.score.toFixed(4)); hs.c1.push(col1); hs.c2.push(col2); hs.id1.push(p.id1); hs.id2.push(p.id2);
                    hs.fn1.push(n1.file_name || n1.md5.slice(0, 8)); hs.fn2.push(n2.file_name || n2.md5.slice(0, 8));

                });

                const rs = { start: [], end: [], color: [], name: [], md5: [], file_name: [], inner_r: [], outer_r: [], count: [], language: [], tags: [] };
                bin_list.forEach(md5 => {
                    const md5_nodes = this.unique_nodes.map((n, i) => ({ n, i })).filter(item => item.n.md5 === md5);
                    if (md5_nodes.length > 0) {
                        const start_idx = md5_nodes[0].i; const end_idx = md5_nodes[md5_nodes.length - 1].i;
                        const col = bin_colors.get(md5);
                        rs.start.push(start_idx * theta_step - theta_step / 2); rs.end.push(end_idx * theta_step + theta_step / 2);
                        rs.color.push(col); rs.name.push(md5.slice(0, 8)); rs.md5.push(md5);
                        rs.file_name.push(md5_nodes[0].n.file_name || md5.slice(0, 8));
                        rs.inner_r.push(ring_inner); rs.outer_r.push(ring_outer);
                        rs.count.push(md5_nodes.length);
                        rs.language.push(md5_nodes[0].n.language_id);
                        const all_tags = new Set();
                        md5_nodes.forEach(item => { (item.n.tags || []).forEach(t => all_tags.add(t)); });
                        rs.tags.push(Array.from(all_tags).join(', '));
                    }
                });

                this.node_source.data = ns; this.seg_source.data = ss; this.hit_source.data = hs; this.ring_source.data = rs;
            }

            blendHex(c1, c2, t) {
                const rgb1 = [parseInt(c1.slice(1, 3), 16), parseInt(c1.slice(3, 5), 16), parseInt(c1.slice(5, 7), 16)];
                const rgb2 = [parseInt(c2.slice(1, 3), 16), parseInt(c2.slice(3, 5), 16), parseInt(c2.slice(5, 7), 16)];
                const res = rgb1.map((v, i) => Math.round(v * (1 - t) + rgb2[i] * t));
                return "#" + res.map(v => v.toString(16).padStart(2, '0')).join('');
            }
        }

        function formatDate(iso) {
            if (!iso || iso === 'N/A') return '---';

                iso = parseInt(iso, 10);
            }

            const d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            return d.toLocaleString();
        }

        // Apply "NOT ignore" defaults only when first entering the Sim view
        function applySimViewDefaults(hashPath, queryString) {
            if (hashPath !== '#function-similarity') return false;
            const pC = new URLSearchParams(queryString);
            let changed = false;

            const hasFunc = pC.has('func_tag') || pC.has('exclude_func_tag') ||
                pC.has('func_static_tag') || pC.has('exclude_func_static_tag') ||
                pC.has('func_user_tag') || pC.has('exclude_func_user_tag') ||
                pC.has('tag') || pC.has('exclude_tag') ||
                pC.has('static_tag') || pC.has('exclude_static_tag') ||
                pC.has('user_tag') || pC.has('exclude_user_tag');
            if (!hasFunc) { pC.set('exclude_func_tag', 'ignore'); changed = true; }

            const hasSim = pC.has('sim_tag') || pC.has('exclude_sim_tag') ||
                pC.has('sim_static_tag') || pC.has('exclude_sim_static_tag') ||
                pC.has('sim_user_tag') || pC.has('exclude_sim_user_tag');
            if (!hasSim) { pC.set('exclude_sim_tag', 'ignore'); changed = true; }

            const hasFile = pC.has('file_tag') || pC.has('exclude_file_tag') ||
                pC.has('file_static_tag') || pC.has('exclude_file_static_tag') ||
                pC.has('file_user_tag') || pC.has('exclude_file_user_tag');
            if (!hasFile) { pC.set('exclude_file_tag', 'ignore'); changed = true; }

            if (changed) {
                window.location.hash = hashPath + '?' + pC.toString();
                return true; // redirected, don't call refreshData yet
            }
            return false;
        }

        class ClusterHierarchy {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.width = this.container.clientWidth;
                this.height = this.container.clientHeight || 700;
                this.root = null;
                this.svg = null;
                this.g = null;

                this.params = {
                    min_cluster_size: 5,
                    stability_threshold: 0.0,
                    show_parents: true,
                    path_compression: true
                };
                this.abortController = null;
            }

            stop() {
                if (this.abortController) this.abortController.abort();
            }

            async fetch(params) {
                if (this.abortController) this.abortController.abort();
                this.abortController = new AbortController();
                const signal = this.abortController.signal;

                const collection = params.get('collection');
                const algo = params.get('algo') || 'unweighted_cosine';

                // Template for controls
                const hierControls = `

                        <div style="margin-bottom:20px;">

                                <input type="range" id="input-feat-min" min="0" max="1000" step="10" value="${this.params.min_features || 0}">

                        <div style="margin-bottom:20px;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">

                                </span>
                            </div>
                            <div class="range-slider-container">
                                <div id="stab-track" class="slider-track" style="width:100%; left:0%;"></div>
                                <input type="range" id="input-stab-min" min="0" max="100" step="1" value="${this.params.stability_threshold || 0}" style="z-index: 3;">
                            </div>
                        </div>

                        <!-- Checkboxes -->
                        <div style="margin-bottom:20px; display:flex; flex-direction:column; gap:8px;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <input type="checkbox" id="input-show-parents" ${this.params.show_parents !== false ? 'checked' : ''} style="cursor:pointer; accent-color:var(--accent);">
                                <label for="input-show-parents" style="font-size:0.75rem; color:#ccc; cursor:pointer; user-select:none;">Show parents</label>
                            </div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <input type="checkbox" id="input-path-compression" ${this.params.path_compression !== false ? 'checked' : ''} style="cursor:pointer; accent-color:var(--accent);">
                                <label for="input-path-compression" style="font-size:0.75rem; color:#ccc; cursor:pointer; user-select:none;">Path compression</label>
                            </div>
                        </div>

                        <button id="hier-refresh-btn" class="btn-primary" style="padding:10px; font-size:0.75rem; width:100%; margin-top:5px; text-transform:uppercase; letter-spacing:1.5px; font-weight:bold;">Update Visualization</button>
                    </div>

                    <div style="position:absolute; bottom:20px; right:20px; z-index:10; background:rgba(0,0,0,0.8); padding:15px; border-radius:8px; border:1px solid #333; max-width:300px; display:none;" id="hierarchy-info-panel">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <h4 id="hier-cluster-name" style="margin:0; color:var(--accent); font-size:0.9rem;">Cluster Info</h4>
                            <button onclick="this.parentElement.parentElement.style.display='none'" style="background:none; border:none; color:#666; cursor:pointer;">&times;</button>
                        </div>
                        <div id="hier-stats" style="font-size:0.85rem; color:#ccc;"></div>
                        <div style="margin-top:15px; display:flex; gap:10px;">
                            <button id="hier-view-btn" class="btn-action" style="flex:1">View Functions →</button>
                        </div>
                    </div>

                    
                    <div id="hierarchy-loader" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--accent); background:#0d0f14;">
                        <div style="text-align:center;">
                            <div class="spinner" style="margin-bottom:15px;"></div>
                            <div style="font-size:0.9rem; letter-spacing:1px;">Rebuilding Dendrogram...</div>
                        </div>
                    </div>
                `;

                this.container.innerHTML = hierControls;

                // Initialize defaults
                this.params.min_cluster_size = this.params.min_cluster_size || 5;
                this.params.max_cluster_size = this.params.max_cluster_size || 0;
                this.params.cohesion_min = this.params.cohesion_min || 0;
                this.params.cohesion_max = this.params.cohesion_max || 0;
                this.params.min_features = this.params.min_features || 0;
                this.params.max_features = this.params.max_features || 0;
                if (this.params.show_parents === undefined) this.params.show_parents = true;
                if (this.params.path_compression === undefined) this.params.path_compression = true;

                const updateTrack = (idPrefix, minVal, maxVal, minLimit, maxLimit) => {
                    const minPercent = ((minVal - minLimit) / (maxLimit - minLimit)) * 100;
                    const maxPercent = ((maxVal - minLimit) / (maxLimit - minLimit)) * 100;
                    const track = document.getElementById(`${idPrefix}-track`);
                    track.style.left = minPercent + "%";
                    track.style.width = (maxPercent - minPercent) + "%";
                };

                // Wire up controls
                // Size
                const sMin = document.getElementById('input-min-size');
                const sMax = document.getElementById('input-max-size');
                const sUpdate = () => {
                    if (parseInt(sMin.value) > parseInt(sMax.value)) sMin.value = sMax.value;
                    this.params.min_cluster_size = parseInt(sMin.value);
                    this.params.max_cluster_size = parseInt(sMax.value) === 100 ? 0 : parseInt(sMax.value);
                    document.getElementById('val-min-size').innerText = this.params.min_cluster_size;
                    document.getElementById('val-max-size').innerText = this.params.max_cluster_size || '∞';
                    updateTrack('size', parseInt(sMin.value), parseInt(sMax.value), 2, 100);
                };
                sMin.oninput = sUpdate;
                sMax.oninput = sUpdate;
                updateTrack('size', this.params.min_cluster_size, this.params.max_cluster_size || 100, 2, 100);

                // Cohesion
                const cMin = document.getElementById('input-min-coh');
                const cMax = document.getElementById('input-max-coh');
                const cUpdate = () => {
                    const cMinE = document.getElementById('input-coh-min');
                    const cMaxE = document.getElementById('input-coh-max');
                    if (parseFloat(cMinE.value) > parseFloat(cMaxE.value)) cMinE.value = cMaxE.value;
                    this.params.cohesion_min = parseFloat(cMinE.value);
                    this.params.cohesion_max = parseFloat(cMaxE.value) >= 1 ? 0 : parseFloat(cMaxE.value);
                    document.getElementById('val-coh-min').innerText = (this.params.cohesion_min * 100).toFixed(0);
                    document.getElementById('val-coh-max').innerText = this.params.cohesion_max > 0 ? (this.params.cohesion_max * 100).toFixed(0) : '100';
                    updateTrack('coh', this.params.cohesion_min, parseFloat(cMaxE.value), 0, 1);
                };
                document.getElementById('input-coh-min').oninput = cUpdate;
                document.getElementById('input-coh-max').oninput = cUpdate;
                updateTrack('coh', this.params.cohesion_min, this.params.cohesion_max || 1, 0, 1);

                // Features
                const fMin = document.getElementById('input-feat-min');
                const fMax = document.getElementById('input-feat-max');
                const fUpdate = () => {
                    if (parseInt(fMin.value) > parseInt(fMax.value)) fMin.value = fMax.value;
                    this.params.min_features = parseInt(fMin.value);
                    this.params.max_features = parseInt(fMax.value) === 1000 ? 0 : parseInt(fMax.value);
                    document.getElementById('val-feat-min').innerText = this.params.min_features;
                    document.getElementById('val-feat-max').innerText = this.params.max_features || '∞';
                    updateTrack('feat', parseInt(fMin.value), parseInt(fMax.value), 0, 1000);
                };
                fMin.oninput = fUpdate;
                fMax.oninput = fUpdate;
                updateTrack('feat', this.params.min_features, this.params.max_features || 1000, 0, 1000);

                // Stability
                const stMin = document.getElementById('input-stab-min');
                const stUpdate = () => {
                    this.params.stability_threshold = parseFloat(stMin.value);
                    document.getElementById('val-stab-min').innerText = this.params.stability_threshold.toFixed(1) + '+';
                    updateTrack('stab', this.params.stability_threshold, 100, 0, 100);
                };
                stMin.oninput = stUpdate;
                updateTrack('stab', this.params.stability_threshold, 100, 0, 100);

                const spCheck = document.getElementById('input-show-parents');
                spCheck.onchange = () => {
                    this.params.show_parents = spCheck.checked;
                };

                const pcCheck = document.getElementById('input-path-compression');
                pcCheck.onchange = () => {
                    this.params.path_compression = pcCheck.checked;
                };

                document.getElementById('hier-refresh-btn').onclick = () => this.fetch(params);

                try {
                    const url = `/api/cluster/dendrogram?collection=${collection}&algo=${algo}` +
                        `&min_cluster_size=${this.params.min_cluster_size}` +
                        `&max_cluster_size=${this.params.max_cluster_size}` +
                        `&cohesion_min=${this.params.cohesion_min}` +
                        `&cohesion_max=${this.params.cohesion_max}` +
                        `&min_features=${this.params.min_features}` +
                        `&max_features=${this.params.max_features}` +
                        `&stability_threshold=${this.params.stability_threshold}` +
                        `&show_parents=${this.params.show_parents}`;
                    const res = await fetch(url, { signal });
                    if (!res.ok) throw new Error("Dendrogram not found");
                    const data = await res.json();

                    if (!data.nodes || data.nodes.length === 0) {
                        this.container.innerHTML += `<div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:#aaa; text-align:center; width:100%;">No clusters match these criteria.<br><span style="font-size:0.8rem; color:#666;">Try lowering the stability cut or minimum size.</span></div>`;
                        const loader = document.getElementById('hierarchy-loader');
                        if (loader) loader.remove();
                        return;
                    }

                    this.render(data.nodes);
                } catch (e) {
                    if (e.name === 'AbortError') return;
                    this.container.innerHTML = `<div style="margin:auto; color:#ff5555; text-align:center;">Error loading hierarchy: ${e.message}</div>`;
                }
            }

            render(nodes) {
                const self = this;
                const loader = document.getElementById('hierarchy-loader');
                if (loader) loader.remove();

                // PATH COMPRESSION: Remove internal nodes with only one child cluster
                // This solves the "ladder" effect where a cluster peels off one-by-one
                if (this.params.path_compression !== false) {
                    let compressedNodes = JSON.parse(JSON.stringify(nodes)); // Deep clone
                    let changed = true;
                    while (changed) {
                        changed = false;
                        const childCounts = {};
                        compressedNodes.forEach(n => {
                            if (n.parent) {
                                childCounts[n.parent] = (childCounts[n.parent] || 0) + 1;
                            }
                        });

                        for (let i = 0; i < compressedNodes.length; i++) {
                            const node = compressedNodes[i];
                            const count = childCounts[node.id] || 0;

                            // We only compress internal nodes that have exactly one child
                            // We don't compress roots (parent === null) or leaves (count === 0)
                            if (count === 1 && node.parent !== null) {
                                const child = compressedNodes.find(n => n.parent === node.id);
                                if (child) {
                                    child.parent = node.parent;
                                    compressedNodes.splice(i, 1);
                                    changed = true;
                                    break; // Restart loop to refresh childCounts
                                }
                            }
                        }
                    }
                    nodes = compressedNodes;
                }

                const width = this.container.clientWidth;
                const height = this.container.offsetHeight || 700;

                // Cleanup old SVG
                d3.select(this.container).selectAll("svg").remove();

                this.svg = d3.select(this.container).append("svg")
                    .attr("width", width)
                    .attr("height", height)
                    .attr("style", "background:#0d0f14; cursor:grab;");

                this.g = this.svg.append("g");

                this.zoom = d3.zoom()
                    .scaleExtent([0.05, 10])
                    .on("zoom", (event) => {
                        this.g.attr("transform", event.transform);
                    });

                this.svg.call(this.zoom);

                // Build D3 hierarchy from flat nodes
                const stratify = d3.stratify()
                    .id(d => d.id)
                    .parentId(d => d.parent);

                // Ensure any node whose parent is not in nodes has its parent set to null
                nodes.forEach(n => {
                    if (n.parent && !nodes.find(p => p.id === n.parent)) {
                        n.parent = null;
                    }
                });

                const rootNodes = nodes.filter(n => !n.parent || !nodes.find(p => p.id === n.parent));

                if (rootNodes.length === 0) {
                    this.root = null;
                } else if (rootNodes.length === 1) {
                    this.root = stratify(nodes);
                } else {
                    // MULTIPLE ROOTS: Create a Virtual Root to connect all islands
                    const virtualRootId = "VIRTUAL_ROOT";
                    const augmentedNodes = [
                        {
                            id: virtualRootId,
                            parent: null,
                            name: "All Clusters",
                            uuid: "root",
                            size: nodes.reduce((acc, n) => (!n.parent || !nodes.find(p => p.id === n.parent)) ? acc + n.size : acc, 0),
                            stability: 0,
                            cohesion: 0,
                            members: []
                        },
                        ...nodes.map(n => {
                            if (!n.parent || !nodes.find(p => p.id === n.parent)) {
                                return { ...n, parent: virtualRootId };
                            }
                            return n;
                        })
                    ];
                    this.root = stratify(augmentedNodes);
                }

                this.root.x0 = height / 2;
                this.root.y0 = 0;

                this.update(this.root);

                // Initial position
                const initialTransform = d3.zoomIdentity.translate(80, height / 2).scale(0.6);
                this.svg.call(this.zoom.transform, initialTransform);
            }

            update(source) {
                const self = this;
                const nodeWidth = 240;
                const nodeHeight = 35;

                const treeLayout = d3.tree().nodeSize([nodeHeight, nodeWidth]);
                treeLayout(this.root);

                const nodes = this.root.descendants();
                const links = this.root.links();

                // Nodes
                const node = this.g.selectAll("g.node")
                    .data(nodes, d => d.data.id);

                const nodeEnter = node.enter().append("g")
                    .attr("class", "node")
                    .attr("transform", d => `translate(${source.y},${source.x})`)
                    .style("cursor", "pointer")
                    .on("click", (event, d) => {
                        const col = document.getElementById('side-collection-select').value;
                        const uuid = d.data.uuid;
                        if (uuid && uuid !== 'root') {
                            window.location.hash = '#functions?collection=' + col + '&cluster_uuid=' + uuid;
                        }
                    })
                    .on("mouseover", (e, d) => {
                        d3.select(e.currentTarget).select("circle").attr("r", 14);
                        self.showTooltip(e, d);
                    })
                    .on("mouseout", (e, d) => {
                        d3.select(e.currentTarget).select("circle").attr("r", 8);
                        self.hideTooltip();
                    });

                const getCohesionColor = (cohesion) => {
                    const hue = Math.max(0, Math.min(120, (cohesion || 0) * 120));
                    return `hsl(${hue}, 100%, 65%)`;
                };

                nodeEnter.append("circle")
                    .attr("r", 8)
                    .attr("stroke", d => getCohesionColor(d.data.cohesion))
                    .attr("stroke-width", 2)
                    .style("fill", d => d._children ? getCohesionColor(d.data.cohesion) : "#1a1a1a")
                    .style("filter", d => d.data.stability > 0.8 ? `drop-shadow(0 0 10px ${getCohesionColor(d.data.cohesion)})` : "none");

                nodeEnter.append("text")
                    .attr("dy", ".35em")
                    .attr("x", d => d.children || d._children ? -15 : 15)
                    .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                    .style("fill", "#fff")
                    .style("font-size", "12px")
                    .style("pointer-events", "none")
                    .text(d => d.data.name)
                    .clone(true).lower()
                    .attr("stroke", "#000")
                    .attr("stroke-width", 3);

                nodeEnter.append("text")
                    .attr("dy", "1.5em")
                    .attr("x", d => d.children || d._children ? -15 : 15)
                    .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                    .style("fill", "#75715e")
                    .style("font-size", "10px")
                    .style("pointer-events", "none")
                    .text(d => d.data.snippet ? `« ${d.data.snippet} »` : "");

                const nodeUpdate = nodeEnter.merge(node);

                nodeUpdate.transition().duration(400)
                    .attr("transform", d => `translate(${d.y},${d.x})`);

                nodeUpdate.select("circle")
                    .style("fill", d => d._children ? getCohesionColor(d.data.cohesion) : "#1a1a1a")
                    .attr("stroke", d => getCohesionColor(d.data.cohesion));

                const nodeExit = node.exit().transition().duration(400)
                    .attr("transform", d => `translate(${source.y},${source.x})`)
                    .remove();

                // Links
                const link = this.g.selectAll("path.link")
                    .data(links, d => d.target.data.id);

                const linkEnter = link.enter().insert("path", "g")
                    .attr("class", "link")
                    .attr("fill", "none")
                    .attr("stroke", "#333")
                    .attr("stroke-width", 1.5)
                    .attr("d", d => {
                        const o = { x: source.x, y: source.y };
                        return diagonal(o, o);
                    });

                link.merge(linkEnter).transition().duration(400)
                    .attr("stroke", d => d.target.data.stability > 0.5 ? "rgba(255,171,46,0.3)" : "#333")
                    .attr("d", d => diagonal(d.source, d.target));

                link.exit().transition().duration(400)
                    .attr("d", d => {
                        const o = { x: source.x, y: source.y };
                        return diagonal(o, o);
                    })
                    .remove();

                function diagonal(s, t) {
                    return `M ${s.y} ${s.x}
                            C ${(s.y + t.y) / 2} ${s.x},
                              ${(s.y + t.y) / 2} ${t.x},
                              ${t.y} ${t.x}`;
                }
            }

            formatFunctionInline(f) {
                if (typeof f === 'string') return `<div style="margin-bottom:2px; color:#aaa;">• ${f}</div>`;
                const sig = formatSigComponent(f.namespace || '', f.return_type || 'void', f.function_name || 'Unknown', f.parameters || []);
                const featCount = f.bsim_features_count || 0;

                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:2px; padding: 2px 0;">
                        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">
                            ${sig.ret ? `<span style="color:#ae81ff; font-size:0.7rem;">${sig.ret}</span> ` : ''}${sig.ns ? `<span style="color:white; font-size:0.7rem;">${sig.ns}::</span>` : ''}<span style="color:var(--accent); font-weight:bold; font-size:0.75rem;">${f.function_name}</span><span style="color:white">(</span>${sig.params.map(t => `<span style="color:#ae81ff; font-size:0.7rem;">${t}</span>`).join('<span style="color:white">, </span>')}<span style="color:white">)</span>
                        </span>
                        <span style="color:var(--accent); font-size:0.65rem; opacity:0.8; white-space:nowrap; flex-shrink:0; font-family:monospace; background:rgba(0,0,0,0.2); padding:1px 4px; border-radius:3px;">
                            ${featCount} <span style="font-size:0.55rem; color:#666; text-transform:uppercase;">feat.</span>
                        </span>
                    </div>
                `;
            }

            async showInfo(d) {
                const panel = document.getElementById('hierarchy-info-panel');
                const title = document.getElementById('hier-cluster-name');
                const stats = document.getElementById('hier-stats');
                const btn = document.getElementById('hier-view-btn');

                panel.style.display = 'block';
                title.innerText = d.data.name;

                const updatePanel = () => {
                    const members = d.data.runtime_members || (d.data.snippet ? [d.data.snippet] : []);
                    const isLoading = !d.data.runtime_members;

                    stats.innerHTML = `
                        <div style="margin-bottom:12px; display:grid; grid-template-columns: 1fr 1fr; gap:8px; font-size:0.75rem;">
                            <div style="background:rgba(255,255,255,0.05); padding:8px; border-radius:4px; border-left:2px solid #555;">
                                <div class="dim" style="font-size:0.6rem; text-transform:uppercase; margin-bottom:2px;">Size</div>
                                <div style="color:#eee; font-weight:bold;">${d.data.size} <span style="font-weight:normal; color:#666; font-size:0.65rem;">funcs</span></div>
                            </div>
                            <div style="background:rgba(255,255,255,0.05); padding:8px; border-radius:4px; border-left:2px solid var(--accent);">
                                <div class="dim" style="font-size:0.6rem; text-transform:uppercase; margin-bottom:2px;">Stability</div>
                                <div style="color:var(--accent); font-weight:bold;">${d.data.stability.toFixed(2)}</div>
                            </div>
                            <div style="background:rgba(255,255,255,0.05); padding:8px; border-radius:4px; border-left:2px solid var(--success);">
                                <div class="dim" style="font-size:0.6rem; text-transform:uppercase; margin-bottom:2px;">Cohesion</div>
                                <div style="color:var(--success); font-weight:bold;">${(d.data.cohesion * 100).toFixed(1)}%</div>
                            </div>
                            <div style="background:rgba(255,255,255,0.05); padding:8px; border-radius:4px; border-left:2px solid #ae81ff;">
                                <div class="dim" style="font-size:0.6rem; text-transform:uppercase; margin-bottom:2px;">Avg Features</div>
                                <div style="color:#ae81ff; font-weight:bold;">${(d.data.avg_features || 0).toFixed(1)}</div>
                            </div>
                        </div>
                        <div style="margin-top:15px; border-top:1px solid #333; padding-top:10px;">
                            <div style="font-size:0.65rem; color:#666; margin-bottom:6px; text-transform:uppercase;">
                                ${isLoading ? '<i class="fas fa-spinner fa-spin"></i> Loading Members...' : 'Sample Members (Live):'}
                            </div>
                            <div style="color:#eee; font-family:monospace; font-size:0.75rem; line-height:1.4;">
                                ${members.map(m => this.formatFunctionInline(m)).join('')}
                                ${d.data.size > members.length ? `<div style="color:#444; margin-top:4px; font-size:0.7rem;">... and ${d.data.size - members.length} more</div>` : ''}
                            </div>
                        </div>
                    `;
                };

                updatePanel();

                if (!d.data.runtime_members && d.data.uuid) {
                    try {
                        const col = document.getElementById('side-collection-select').value;
                        const res = await fetch(`/api/function/search?collection=${col}&cluster_uuid=${d.data.uuid}&limit=5`);
                        const data = await res.json();
                        d.data.runtime_members = data.functions;
                        updatePanel();
                    } catch (e) {
                        console.error("Failed to fetch runtime members", e);
                    }
                }

                btn.onclick = () => {
                    const col = document.getElementById('side-collection-select').value;
                    const uuid = d.data.uuid;
                    window.location.hash = `#functions?collection=${col}&cluster_uuid=${uuid}`;
                };
            }

            async showTooltip(event, d) {
                this._activeD = d;
                const tooltip = document.getElementById('hierarchy-tooltip');
                tooltip.style.display = 'block';
                let x = event.clientX + 20;
                let y = event.clientY + 20;
                const rect = tooltip.getBoundingClientRect();
                if (x + rect.width > window.innerWidth) x = event.clientX - rect.width - 20;
                if (y + rect.height > window.innerHeight) y = event.clientY - rect.height - 20;
                tooltip.style.left = x + 'px';
                tooltip.style.top = y + 'px';

                // SNAPPY SCROLL Logic
                if (d.data.scrollOffset === undefined) d.data.scrollOffset = 0;

                const nodeEl = event.currentTarget;
                if (!nodeEl._hasWheelListener) {
                    nodeEl._hasWheelListener = true;
                    nodeEl.addEventListener('wheel', (e) => {
                        e.preventDefault();
                        e.stopPropagation();

                        if (e.ctrlKey) {
                            const codeScrollEl = document.querySelector('#hier-snippet-container .c-code-container');
                            if (codeScrollEl) {
                                codeScrollEl.scrollTop += e.deltaY;
                                this._codeScrollTop = codeScrollEl.scrollTop;
                            }
                            return;
                        }

                        const delta = Math.sign(e.deltaY);
                        const members = d.data.runtime_members || [];
                        if (members.length === 0) return;

                        d.data.scrollOffset = Math.max(0, Math.min(members.length - 1, d.data.scrollOffset + delta));
                        this.renderTooltip(tooltip, d);
                    }, { passive: false });
                }

                this.renderTooltip(tooltip, d);

                if (!d.data.runtime_members && d.data.uuid) {
                    try {
                        const col = document.getElementById('side-collection-select').value;
                        const res = await fetch(`/api/function/search?collection=${col}&cluster_uuid=${d.data.uuid}&limit=100`);
                        const data = await res.json();
                        d.data.runtime_members = data.functions;
                        this.renderTooltip(tooltip, d);
                    } catch (e) {
                        console.error("Failed to fetch runtime members", e);
                    }
                }
            }

            renderTooltip(tooltip, d) {
                const members = d.data.runtime_members || [];
                const isLoading = !d.data.runtime_members;
                const scrollOffset = d.data.scrollOffset || 0;
                const selectedFunc = members[scrollOffset];

                const isSameNode = tooltip.querySelector('.hier-tooltip-container') && this._renderedNodeUuid === d.data.uuid;

                if (!isSameNode) {
                    this._renderedNodeUuid = d.data.uuid;
                    tooltip.innerHTML = `
                        <div class="hier-tooltip-container">
                            <div class="hier-left-col" style="padding: 12px;">
                                <div style="color:var(--accent); font-weight:bold; margin-bottom:4px; font-size:0.95rem;">${d.data.name}</div>
                                <div style="color:#666; font-size:0.65rem; margin-bottom:10px; font-family:monospace; overflow:hidden; text-overflow:ellipsis;">${d.data.uuid}</div>
                                
                                <div style="margin-bottom:12px; display:grid; grid-template-columns: 1fr 1fr; gap:8px; font-size:0.75rem;">
                                    <div style="background:rgba(255,255,255,0.05); padding:4px 8px; border-radius:4px; border-left:2px solid #555;">
                                        <div class="dim" style="font-size:0.6rem; text-transform:uppercase; margin-bottom:2px;">Size</div>
                                        <div style="color:#eee; font-weight:bold;">${d.data.size} <span style="font-weight:normal; color:#666; font-size:0.65rem;">funcs</span></div>
                                    </div>
                                    <div style="background:rgba(255,255,255,0.05); padding:4px 8px; border-radius:4px; border-left:2px solid var(--accent);">
                                        <div class="dim" style="font-size:0.6rem; text-transform:uppercase; margin-bottom:2px;">Stability</div>
                                        <div style="color:var(--accent); font-weight:bold;">${d.data.stability.toFixed(2)}</div>
                                    </div>
                                    <div style="background:rgba(255,255,255,0.05); padding:4px 8px; border-radius:4px; border-left:2px solid var(--success);">
                                        <div class="dim" style="font-size:0.6rem; text-transform:uppercase; margin-bottom:2px;">Cohesion</div>
                                        <div style="color:var(--success); font-weight:bold;">${(d.data.cohesion * 100).toFixed(1)}%</div>
                                    </div>
                                    <div style="background:rgba(255,255,255,0.05); padding:4px 8px; border-radius:4px; border-left:2px solid #ae81ff;">
                                        <div class="dim" style="font-size:0.6rem; text-transform:uppercase; margin-bottom:2px;">Avg Features</div>
                                        <div style="color:#ae81ff; font-weight:bold;">${(d.data.avg_features || 0).toFixed(1)}</div>
                                    </div>
                                </div>

                                <div style="border-top:1px solid #333; padding-top:10px; flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                                    <div class="hier-samples-title" style="font-size:0.6rem; color:#555; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;">
                                        ${isLoading ? '<i class="fas fa-spinner fa-spin"></i> Fetching Live Samples...' : `Samples (${members.length}):`}
                                    </div>
                                    <div class="hier-function-list">
                                        <div class="hier-function-list-scroll" style="transition: transform 0.1s cubic-bezier(0.17, 0.67, 0.83, 0.67);">
                                            ${members.map((m, i) => {
                                                const sig = formatSigComponent(m.namespace || '', m.return_type || 'void', m.function_name || 'Unknown', m.parameters || []);
                                                return `
                                                    <div class="hier-function-item" data-index="${i}">
                                                        <span style="opacity: 0.5; margin-right: 6px; font-size: 0.7rem; font-family: monospace;">${i + 1}.</span>
                                                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;">
                                                            ${sig.ret ? `<span style="color:#ae81ff">${sig.ret}</span> ` : ''}${sig.ns ? `<span style="color:white">${sig.ns}::</span>` : ''}<span class="func-name-span" style="font-weight:bold;">${m.function_name}</span><span style="color:white">(</span>${sig.params.map(t => `<span style="color:#ae81ff">${t}</span>`).join('<span style="color:white">, </span>')}<span style="color:white">)</span>
                                                        </span>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>
                                    ${d.data.size > members.length ? `<div style="color:#444; margin-top:6px; font-size:0.65rem;">... and ${d.data.size - members.length} more</div>` : ''}
                                </div>
                            </div>
                            <div class="hier-right-col" id="hier-snippet-container">
                                <div class="hier-snippet-placeholder" style="padding: 20px; color: #666; text-align: center; font-size: 0.8rem;">
                                    ${selectedFunc ? '<i class="fas fa-spinner fa-spin"></i> Loading Preview...' : 'Select a function to preview'}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    const samplesTitle = tooltip.querySelector('.hier-samples-title');
                    if (samplesTitle) {
                        samplesTitle.innerHTML = isLoading ? '<i class="fas fa-spinner fa-spin"></i> Fetching Live Samples...' : `Samples (${members.length}):`;
                    }

                    const listScroll = tooltip.querySelector('.hier-function-list-scroll');
                    if (listScroll && listScroll.children.length === 0 && members.length > 0) {
                        listScroll.innerHTML = members.map((m, i) => {
                            const sig = formatSigComponent(m.namespace || '', m.return_type || 'void', m.function_name || 'Unknown', m.parameters || []);
                            return `
                                <div class="hier-function-item" data-index="${i}">
                                    <span style="opacity: 0.5; margin-right: 6px; font-size: 0.7rem; font-family: monospace;">${i + 1}.</span>
                                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;">
                                        ${sig.ret ? `<span style="color:#ae81ff">${sig.ret}</span> ` : ''}${sig.ns ? `<span style="color:white">${sig.ns}::</span>` : ''}<span class="func-name-span" style="font-weight:bold;">${m.function_name}</span><span style="color:white">(</span>${sig.params.map(t => `<span style="color:#ae81ff">${t}</span>`).join('<span style="color:white">, </span>')}<span style="color:white">)</span>
                                    </span>
                                </div>
                            `;
                        }).join('');
                    }
                }

                const listScroll = tooltip.querySelector('.hier-function-list-scroll');
                if (listScroll) {
                    listScroll.style.transform = `translateY(-${scrollOffset * 30}px)`;
                    Array.from(listScroll.children).forEach((itemEl, idx) => {
                        const isSelected = idx === scrollOffset;
                        itemEl.classList.toggle('selected', isSelected);
                        const nameSpan = itemEl.querySelector('.func-name-span');
                        if (nameSpan) {
                            nameSpan.style.color = isSelected ? 'var(--accent)' : '#eee';
                        }
                    });
                }

                if (selectedFunc) {
                    this.updateSnippet(selectedFunc);
                }
            }

            async updateSnippet(func) {
                const container = document.getElementById('hier-snippet-container');
                if (!container) return;

                const funcId = func.function_id;

                if (window.previewCache && window.previewCache.has(funcId)) {
                    this.renderSnippet(window.previewCache.get(funcId), func, container);
                    return;
                }

                const existingSnippet = container.querySelector('.hier-code-snippet');
                if (existingSnippet) {
                    existingSnippet.style.opacity = '0.4';
                } else {
                    container.innerHTML = `
                        <div class="hier-snippet-placeholder" style="padding: 20px; color: #666; text-align: center; font-size: 0.8rem;">
                            <i class="fas fa-spinner fa-spin"></i> Loading Preview...
                        </div>
                    `;
                }

                try {
                    const res = await fetch(`/api/function/code?id=${encodeURIComponent(funcId)}`);
                    if (!res.ok) throw new Error("Failed");
                    const data = await res.json();
                    if (window.previewCache) window.previewCache.set(funcId, data);
                    
                    if (this._activeD && this._activeD.data.runtime_members) {
                        const currentMembers = this._activeD.data.runtime_members;
                        const currentScrollOffset = this._activeD.data.scrollOffset || 0;
                        const currentSelected = currentMembers[currentScrollOffset];
                        if (currentSelected && currentSelected.function_id === funcId) {
                            this.renderSnippet(data, func, container);
                        }
                    }
                } catch (e) {
                    if (this._activeD && this._activeD.data.runtime_members) {
                        const currentMembers = this._activeD.data.runtime_members;
                        const currentScrollOffset = this._activeD.data.scrollOffset || 0;
                        const currentSelected = currentMembers[currentScrollOffset];
                        if (currentSelected && currentSelected.function_id === funcId) {
                            container.innerHTML = `<div style="padding: 20px; color: #ff5555; text-align: center;">Preview Error</div>`;
                        }
                    }
                }
            }

            renderSnippet(data, func, container) {
                const rows = data.rows;
                const m = data.meta || {};

                let html = `
                    <div class="hier-code-snippet" style="height: 100%; display: flex; flex-direction: column;">
                        <div style="padding: 10px 15px; border-bottom: 1px solid #222; background: rgba(0,0,0,0.3); flex-shrink: 0;">
                            <div style="font-size: 0.75rem; color: var(--accent); font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                ${m.return_type || ''} ${m.namespace ? m.namespace + '::' : ''}${func.function_name}
                            </div>
                            <div style="font-size: 0.6rem; color: #555; font-family: monospace; margin-top: 2px;">
                                Addr: ${func.entrypoint_address} | Feat: ${func.bsim_features_count}
                            </div>
                        </div>
                        <div class="c-code-container" style="overflow-y: auto; flex: 1; padding: 10px;">`;

                rows.forEach(row => {
                    let lineHtml = '';
                    row.tokens.forEach(t => {
                        const featClass = t.has_features ? 'feature-highlight' : '';
                        lineHtml += `<span class="token token-${t.type} ${featClass}">${t.text.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>`;
                    });
                    html += `<div class="code-line"><div class="gutter"><div class="line-num" style="font-size: 0.6rem;">${row.line_idx}</div></div><div class="line-content">${lineHtml}</div></div>`;
                });

                html += `</div></div>`;
                container.innerHTML = html;

                // Restore last scroll position
                const codeScrollEl = container.querySelector('.c-code-container');
                if (codeScrollEl && this._codeScrollTop !== undefined) {
                    codeScrollEl.scrollTop = this._codeScrollTop;
                }
            }

            hideTooltip() {
                this._activeD = null;
                this._renderedNodeUuid = null;
                const el = document.getElementById('hierarchy-tooltip');
                if (el) el.style.display = 'none';
            }
        }

        const clusterTooltipMockCache = new Map();

        function showClusterTableTooltip(event, uuid, name, size, stability, cohesion, avg_features) {
            if (!window.hierarchyInstance) {
                window.hierarchyInstance = new ClusterHierarchy('hierarchy-view-container');
            }
            if (!clusterTooltipMockCache.has(uuid)) {
                clusterTooltipMockCache.set(uuid, {
                    data: { uuid, name, size, stability, cohesion, avg_features, scrollOffset: 0 }
                });
            }
            const mockD = clusterTooltipMockCache.get(uuid);
            window.hierarchyInstance.showTooltip(event, mockD);
        }

        function hideClusterTableTooltip() {
            if (window.hierarchyInstance) window.hierarchyInstance.hideTooltip();
        }

        function moveClusterTableTooltip(e) {
            const tooltip = document.getElementById('hierarchy-tooltip');
            if (tooltip && tooltip.style.display === 'block') {
                let x = e.clientX + 20;
                let y = e.clientY + 20;
                const rect = tooltip.getBoundingClientRect();
                if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - 20;
                if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 20;
                tooltip.style.left = x + 'px';
                tooltip.style.top = y + 'px';
            }
        }
    </script>
