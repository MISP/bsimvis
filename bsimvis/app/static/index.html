<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSim Vis Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-3.3.4.min.js"></script>
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-widgets-3.3.4.min.js"></script>
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-api-3.3.4.min.js"></script>
    <script src="/js/tags.js"></script>
    <script src="/js/diff_queue.js"></script>
    <script src="/js/previews.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdn.bokeh.org/bokeh/release/bokeh-3.3.4.min.css" type="text/css" />
    <link rel="stylesheet" href="https://cdn.bokeh.org/bokeh/release/bokeh-widgets-3.3.4.min.css" type="text/css" />
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/js/utils.js"></script>
    <script src="/js/code_renderer.js"></script>
    <script src="/js/metadata.js"></script>
    <script src="/js/similarity_graph.js"></script>
    <script src="/js/cluster_views.js"></script>
    <script src="/js/call_graph.js"></script>
    <script src="/js/dashboard.js"></script>

<body>
    <button id="sidebar-toggle" onclick="toggleSidebar()" title="Toggle Sidebar">⟨</button>
    <nav>
        <h2 title="BSim Vis"><i class="fa-solid fa-circle-nodes" style="color: var(--accent);"></i> <span>BSim
                Vis</span></h2>
        <a href="#collections" id="nav-collections" title="Collections"><i class="fa-solid fa-layer-group"></i>
            <span>Collections</span></a>

        <div class="nav-collection-container"
            style="padding: 20px 20px 5px 20px; border-top: 1px solid var(--border); margin-top: 15px; transition: padding 0.3s; box-sizing: border-box;">
            <div class="dim collection-label"
                style="font-size: 0.6rem; text-transform: uppercase; margin-bottom: 5px; display: flex; align-items: center; gap: 8px;"
                title="Current Collection">
                <i class="fa-solid fa-database" style="color: var(--subtle);"></i> <span>Current Collection</span>
            </div>
            <select id="side-collection-select" title="Select Collection"
                style="width: 100%; background: #111; color: var(--success); border: 1px solid var(--border); padding: 6px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; cursor: pointer; text-overflow: ellipsis; overflow: hidden; box-sizing: border-box;">
                <option value="">None Selected</option>
            </select>
        </div>

        <a href="#batches" id="nav-batches" title="Batches" style="display:none"><i
                class="fa-solid fa-boxes-stacked"></i> <span>Batches</span></a>
        <a href="#files" id="nav-files" title="Files" style="display:none"><i class="fa-solid fa-file-code"></i>
            <span>Files</span></a>
        <a href="#functions" id="nav-functions" title="Functions" style="display:none"><i class="fa-solid fa-code"></i>
            <span>Functions</span></a>
        <a href="#features-global" id="nav-features-global" title="Features" style="display:none"><i
                class="fa-solid fa-fingerprint"></i> <span>Features</span></a>
        <a href="#function-similarity" id="nav-function-similarity" title="Function Similarities"
            style="display:none"><i class="fa-solid fa-code-compare"></i> <span>Similarities</span></a>
        <a href="#clusters" id="nav-clusters" title="Clusters" style="display:none"><i class="fa-solid fa-bullseye"></i>
            <span>Clusters</span></a>
        <a href="#file-call-graph" id="nav-file-call-graph" title="Call Graph" style="display:none"><i class="fa-solid fa-sitemap"></i>
            <span>Call Graph</span></a>

        <div style="margin-top:auto; padding-top:20px; border-top: 1px solid var(--border);">
            <div class="dim nav-section-title"
                style="padding: 0 20px 10px 20px; font-size: 0.6rem; text-transform: uppercase; display: flex; align-items: center; gap: 8px;"
                title="Tools">
                <i class="fa-solid fa-toolbox" style="color: var(--subtle);"></i> <span>Tools</span>
            </div>
            <a href="#" id="nav-diffing" onclick="showDiffView()" title="Diffing Tool"
                style="color:var(--accent); font-weight:bold;"><i class="fa-solid fa-plus-minus"
                    style="color: var(--accent);"></i> <span>Diffing Tool</span></a>
        </div>
    </nav>

    <main>
        <div class="header">
            <div class="header-top">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <h1 id="view-title" style="margin:0">Dashboard</h1>
                        <span id="view-collection-badge" class="badge"
                            style="display:none; font-size:0.8rem; background:var(--card-bg); color:var(--accent); border:1px solid var(--border);"></span>
                    </div>
                    <span id="view-total" class="badge"
                        style="background:rgba(255,171,46,0.1); color:var(--accent); font-size:0.75rem; display:none; border:1px solid rgba(255,171,46,0.3)"></span>
                    <div id="search-settings-container" style="display:none; align-items:center; gap:8px;"></div>
                </div>
                <div id="header-top-actions" style="display:flex; gap:10px; align-items:center;">
                    <div id="diff-queue-status" style="font-size:0.8rem; color:var(--dim)"></div>
                    <button onclick="refreshData(false, true)" class="top-action-btn" title="Refresh Data">
                        <i class="fa-solid fa-arrows-rotate" style="color:var(--accent);"></i> Refresh
                    </button>
                    <button onclick="clearFilters()" class="top-action-btn danger-btn" title="Clear All Filters">
                        <i class="fa-solid fa-trash-can"></i> Clear
                    </button>
                    <button id="toggle-filters-btn" class="toggle-btn active" onclick="toggleFilters()" title="Toggle Filters">
                        <i class="fa-solid fa-filter"></i> Filters
                    </button>
                    <button id="collapse-header-btn" class="toggle-btn active" onclick="toggleHeader()" title="Toggle Search Area">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                </div>
            </div>
            <div id="search-area"></div>
        </div>


        <div class="table-container" id="table-view-container" style="display: flex; flex-direction: column;">
            <table id="data-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
            <div id="loader">Loading...</div>

            <div id="graph-view-container"
                style="display:none; flex: 1; min-height: 400px; border:1px solid var(--border); background:#121212; border-radius:4px; overflow:hidden; margin: 10px; position:relative;">
                <div id="graph-loading-overlay">
                    <div class="spinner-graph"></div>
                    <div id="graph-loading-text">Initializing Map...</div>
                    <div id="graph-stream-info" style="margin-top:10px; font-size:14px; color:#aaa;"></div>
                </div>
                <div id="bk-similarity-plot" style="width:100%; height:100%;"></div>
                <div class="graph-controls">
                    <button id="graph-refresh-btn" class="btn-graph" title="Force Reload Data">↺ Refresh Map</button>
                    <button id="graph-stop-btn" class="btn-graph stop" style="display:none">Stop Load</button>
                </div>
            </div>

            <div id="hierarchy-view-container"
                style="display:none; flex: 1; min-height: 400px; border:1px solid var(--border); background:#0d0f14; border-radius:4px; overflow:hidden; margin: 10px; position:relative;">
            </div>

            <div id="packing-view-container"
                style="display:none; flex: 1; min-height: 400px; border:1px solid var(--border); background:#0d0f14; border-radius:4px; overflow:hidden; margin: 10px; position:relative;">
            </div>

            <div id="call-graph-view-container"
                style="display:none; flex: 1; min-height: 400px; border:1px solid var(--border); background:#0d0f14; border-radius:4px; overflow:hidden; margin: 10px; position:relative;">
            </div>

            <div id="pagination-container" class="load-more-container"></div>
        </div>
    </main>

    <!-- Extracted script block 1 -->

    <!-- Code Panel -->
    <div id="code-panel">
        <div class="resize-handle"></div>
        <div id="code-panel-header">
            <div style="display:flex; align-items:center;">
                <span class="code-view-badge"
                    style="background:var(--accent); color:#000; padding:2px 8px; border-radius:10px; font-size:0.7rem; margin-right:10px;">CODE
                    VIEW</span>
                <span id="code-title" style="font-weight:bold; font-size:0.9rem; color:var(--accent);">Function
                    View</span>
            </div>
            <div class="panel-actions">
                <button class="btn-sim-action" onclick="seeSimilarFromCode()"><i class="fa-solid fa-code-compare"
                        style="margin-right:4px;"></i> See Similar</button>
                <button class="btn-panel" onclick="launchExternal('code')">Open in New Window ↗</button>
                <button class="btn-panel" onclick="hideCodePanel()"
                    style="color:#ff5555; border-color:rgba(255,85,85,0.3)">Close View</button>
            </div>
        </div>
        <iframe id="code-frame" style="width:100%; flex:1; border:none; background:#0d0f14;"></iframe>
    </div>

    <!-- Feature Panel -->
    <div id="feature-panel">
        <div class="resize-handle"></div>
        <div id="feature-panel-header">
            <div style="display:flex; align-items:center;">
                <span
                    style="background:#a6e22e; color:#000; padding:2px 8px; border-radius:10px; font-size:0.7rem; margin-right:10px; font-weight:bold;">FEATURES</span>
                <span id="feature-title" style="font-weight:bold; font-size:0.9rem; color:var(--accent);">Function
                    Feature Audit</span>
            </div>
            <div class="panel-actions">
                <button class="btn-panel" onclick="launchExternal('features')">Open in New Window ↗</button>
                <button class="btn-panel" onclick="hideFeaturePanel()"
                    style="color:#ff5555; border-color:rgba(255,85,85,0.3)">Close Panel</button>
            </div>
        </div>
        <iframe id="feature-frame" style="width:100%; flex:1; border:none; background:#0d0f14;"></iframe>
    </div>

    <!-- Global Feature Panel -->
    <div id="global-feature-panel">
        <div class="resize-handle"></div>
        <div id="global-feature-panel-header">
            <div style="display:flex; align-items:center;">
                <span
                    style="background:var(--accent); color:#000; padding:2px 8px; border-radius:10px; font-size:0.7rem; margin-right:10px; font-weight:bold;">FEATURE
                    ANALYSIS</span>
                <span id="global-feature-title" style="font-weight:bold; font-size:0.9rem; color:var(--accent);">Feature
                    Search</span>
            </div>
            <div class="panel-actions">
                <button class="btn-panel" onclick="launchExternal('global-feature')">Open in New Window ↗</button>
                <button class="btn-panel" onclick="hideGlobalFeaturePanel()"
                    style="color:#ff5555; border-color:rgba(255,85,85,0.3)">Close Panel</button>
            </div>
        </div>
        <iframe id="global-feature-frame" style="width:100%; flex:1; border:none; background:#0d0f14;"></iframe>
    </div>

    <!-- Diff Panel -->
    <div id="diff-panel">
        <div class="resize-handle"></div>
        <div id="diff-panel-header">
            <div style="display:flex; align-items:center;">
                <span
                    style="background:#f92672; color:#fff; padding:2px 8px; border-radius:10px; font-size:0.7rem; margin-right:10px; font-weight:bold;">DIFF</span>
                <span id="diff-title" style="font-weight:bold; font-size:0.9rem; color:var(--accent);">Function
                    Comparison</span>
            </div>
            <div class="panel-actions">
                <button class="btn-panel" onclick="launchExternal('diff')">Open in New Window ↗</button>
                <button class="btn-panel" onclick="hideDiffPanel()"
                    style="color:#ff5555; border-color:rgba(255,85,85,0.3)">Close Panel</button>
            </div>
        </div>
        <iframe id="diff-frame" style="width:100%; flex:1; border:none; background:#0d0f14;"></iframe>
    </div>

    <div id="code-preview-tooltip"></div>
    <div id="token-tooltip"></div>
    <div id="diff-preview-tooltip"></div>
    <div id="hierarchy-tooltip"
        style="position:fixed; z-index:20003; background:rgba(13,15,20,0.98); border-radius:8px; border:1px solid var(--accent); display:none; pointer-events:auto; font-size:0.8rem; box-shadow:0 15px 50px rgba(0,0,0,0.9); max-width:none; backdrop-filter:blur(15px); overflow:hidden;">
    </div>


    <!-- Extracted script block 2 -->
</body>

</html>
