<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSimVis Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/tags.js"></script>
    <script src="/js/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <script src="/js/diff_queue.js"></script>
    <script src="/js/previews.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/js/utils.js"></script>
    <script src="/js/entity_renderer.js"></script>
    <script src="/js/code_renderer.js"></script>
    <script src="/js/metadata.js"></script>
    <script src="/js/similarity_graph.js"></script>
    <script src="/js/cluster_views.js"></script>
    <script src="/js/bin_cluster_views.js"></script>
    <script src="/js/call_graph.js"></script>
    <script src="/js/binary_similarity.js"></script>
    <script src="/js/chord_graph.js"></script>
    <script src="/js/window_manager.js"></script>
    <script src="/js/upload.js"></script>
    <script src="/js/context_menu.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/jobs.js"></script>
    <script src="/js/table_selection.js"></script>
</head>

<body>

    <button id="sidebar-toggle" onclick="toggleSidebar()" title="Toggle Sidebar">⟨</button>
    <nav>
        <h2 title="BSimVis">
            <a href="https://github.com/MISP/bsimvis" target="_blank" id="brand-link">
                <img src="/logo.svg" alt="Logo">
                <span>BSimVis</span>
            </a>
        </h2>
        <a href="#collections" id="nav-collections" title="Collections"
            style="border-bottom: 1px solid var(--border); margin-bottom: 15px; padding-bottom: 15px;">
            <i class="fa-solid fa-layer-group"></i>
            <span id="current-collection-name">Collections</span>
        </a>

        <div class="nav-section-title">
            <span>Binaries</span>
        </div>
        <div class="nav-section-content">
            <a href="#batches" id="nav-batches" title="Batches" style="display:none"><i
                    class="fa-solid fa-boxes-stacked"></i> <span>Batches</span></a>
            <a href="#files" id="nav-files" title="Files" style="display:none"><i class="fa-solid fa-file-code"></i>
                <span>Files</span></a>
            <a href="#binary-similarity" id="nav-binary-similarity" title="Similarities" style="display:none">
                <i class="fa-solid fa-code-compare"></i>
                <span>Similarities</span>
                <button class="nav-rebuild-btn"
                    onclick="event.preventDefault(); event.stopPropagation(); triggerRebuildAll();"
                    title="Rebuild Analysis">
                    <i class="fa-solid fa-arrows-rotate nav-rebuild-icon"></i>
                </button>
            </a>
            <a href="#bin-clusters" id="nav-bin-clusters" title="Clusters" style="display:none">
                <i class="fa-solid fa-bullseye"></i>
                <span>Clusters</span>
            </a>
            <a href="#file-call-graph" id="nav-file-call-graph" title="Call Graph" style="display:none"><i
                    class="fa-solid fa-sitemap"></i>
                <span>Call Graph</span></a>
        </div>

        <div class="nav-section-title">
            <span>Functions</span>
        </div>
        <div class="nav-section-content">
            <a href="#functions" id="nav-functions" title="Functions" style="display:none"><i
                    class="fa-solid fa-code"></i>
                <span>Functions</span></a>
            <a href="#function-similarity" id="nav-function-similarity" title="Function Similarities"
                style="display:none"><i class="fa-solid fa-code-compare"></i> <span>Similarities</span></a>
            <a href="#clusters" id="nav-clusters" title="Clusters" style="display:none">
                <i class="fa-solid fa-bullseye"></i>
                <span>Clusters</span>
                <button class="nav-rebuild-btn"
                    onclick="event.preventDefault(); event.stopPropagation(); triggerRebuildAll();"
                    title="Rebuild Analysis">
                    <i class="fa-solid fa-arrows-rotate nav-rebuild-icon"></i>
                </button>
            </a>
            <a href="#features-global" id="nav-features-global" title="Features" style="display:none"><i
                    class="fa-solid fa-fingerprint"></i> <span>Features</span></a>
        </div>

        <div style="margin-top:auto; padding-top:20px; border-top: 1px solid var(--border);">
            <a href="#" id="nav-diffing" onclick="showDiffView()" title="Diffing Tool"
                style="color:var(--accent); font-weight:bold;"><i class="fa-solid fa-plus-minus"
                    style="color: var(--accent);"></i> <span>Diffing Tool</span></a>
            <a href="#upload" id="nav-upload" title="Upload Binaries"><i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Upload</span></a>
            <a href="#jobs" id="nav-jobs" title="Background Jobs" style="color:var(--text);"><i id="nav-jobs-icon"
                    class="fa-solid fa-server" style="color: var(--subtle);"></i>
                <div id="nav-jobs-loader" class="nav-job-spinner" style="display:none;"></div> <span>Jobs</span>
            </a>
            <div class="history-dropdown-container" style="position: relative;">
                <a href="javascript:void(0)" id="nav-history" title="Search History" style="color:var(--text);"><i
                        class="fa-solid fa-clock-rotate-left" style="color: var(--subtle);"></i> <span>History</span>
                    <i class="fa-solid fa-chevron-down" id="nav-history-chevron"
                        style="font-size:0.75rem; margin-left:auto; transition: transform 0.2s;"></i>
                </a>
                <div id="history-dropdown" class="history-dropdown" style="display:none;"></div>
            </div>
            <a href="/api/" target="_blank" id="nav-api" title="API Documentation" style="color:var(--text);"><i
                    class="fa-solid fa-book" style="color: var(--subtle);"></i> <span>API</span></a>
        </div>
    </nav>

    <main>
        <div class="header">
            <div class="header-top">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <h1 id="view-title" style="margin:0">Dashboard</h1>
                        <span id="view-collection-badge" class="badge"
                            style="display:none; font-size:0.8rem; background:var(--card-bg); color:var(--accent); border:1px solid var(--border);"></span>
                    </div>
                    <span id="view-total" class="badge"
                        style="background:rgba(255,171,46,0.1); color:var(--accent); font-size:0.75rem; display:none; border:1px solid rgba(255,171,46,0.3)"></span>
                    <div id="search-settings-container" style="display:none; align-items:center; gap:8px;"></div>
                </div>
                <div id="header-top-actions" style="display:flex; gap:10px; align-items:center;">
                    <div id="diff-queue-status" style="font-size:0.8rem; color:var(--dim)"></div>
                    <div id="file-diff-queue-status" style="font-size:0.8rem; color:var(--dim)"></div>

                    <button id="header-rebuild-all-btn" onclick="triggerRebuildAll()" class="top-action-btn"
                        title="Rebuild Analysis" style="display:none; color:var(--accent); border-color:var(--accent);">
                        <i class="fa-solid fa-arrows-rotate" id="header-rebuild-all-icon"></i> Rebuild Analysis
                    </button>

                    <button onclick="refreshData(false, true)" class="top-action-btn" title="Refresh Data">
                        <i class="fa-solid fa-arrows-rotate" style="color:var(--accent);"></i> Refresh
                    </button>

                    <button onclick="clearFilters()" class="top-action-btn danger-btn" title="Clear All Filters">
                        <i class="fa-solid fa-trash-can"></i> Clear
                    </button>
                    <div class="view-history-container" style="position:relative;">
                        <button id="view-history-btn" class="top-action-btn" title="View Search History">
                            <i class="fa-solid fa-clock-rotate-left"></i> History
                        </button>
                        <div id="view-history-dropdown" class="history-dropdown view-history-dropdown"
                            style="display:none;"></div>
                    </div>
                    <div class="export-dropdown-container" id="export-dropdown-container"
                        style="position:relative; display:none;">
                        <button id="export-btn" class="top-action-btn" title="Export Results"
                            onclick="toggleExportDropdown(event)">
                            <i class="fa-solid fa-download" style="color:var(--accent);"></i>
                        </button>
                        <div id="export-dropdown" class="history-dropdown view-history-dropdown"
                            style="display:none; width:155px; border-top-color:var(--accent); right:0; left:auto;">
                            <div class="history-dropdown-title" style="color:var(--accent);">Export Options</div>
                            <a href="#"
                                onclick="event.preventDefault(); downloadSearchResults('csv'); closeExportDropdown();"
                                class="history-item"
                                style="display:flex; align-items:center; text-decoration:none; color:var(--text); font-size:0.75rem; gap:8px;">
                                <i class="fa-solid fa-file-csv" style="color:#22c55e; font-size:0.9rem;"></i> Export as
                                CSV
                            </a>
                            <a href="#"
                                onclick="event.preventDefault(); downloadSearchResults('json'); closeExportDropdown();"
                                class="history-item"
                                style="display:flex; align-items:center; text-decoration:none; color:var(--text); font-size:0.75rem; gap:8px;">
                                <i class="fa-solid fa-file-code" style="color:#3b82f6; font-size:0.9rem;"></i> Export as
                                JSON
                            </a>
                        </div>
                    </div>
                    <button id="toggle-filters-btn" class="toggle-btn active" onclick="toggleFilters()"
                        title="Toggle Filters">
                        <i class="fa-solid fa-filter"></i> Filters
                    </button>
                    <button id="collapse-header-btn" class="toggle-btn active" onclick="toggleHeader()"
                        title="Toggle Search Area">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                    <button onclick="toggleUISettings()" class="top-action-btn" title="UI Settings">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>
            <div id="search-area"></div>
        </div>

        <!-- UI Settings Panel -->
        <div id="ui-settings-panel"
            style="display:none; position:fixed; right:20px; top:60px; z-index:10000; width:300px; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="margin:0; font-size:1rem; color:var(--accent);">UI Settings</h3>
                <button onclick="toggleUISettings()"
                    style="background:none; border:none; color:var(--dim); cursor:pointer;"><i
                        class="fa-solid fa-times"></i></button>
            </div>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom: 12px;">
                <input type="checkbox" id="param-color-tags" onchange="updateUIParams()">
                <label style="font-size:0.8rem;">Color by Tags</label>
            </div>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom: 20px;">
                <input type="checkbox" id="param-include-headers" onchange="updateUIParams()">
                <label style="font-size:0.8rem;">Include Headers in Copy</label>
            </div>

            <div style="border-top: 1px solid var(--border); padding-top: 15px;">
                <button onclick="resetColumnWidths()" class="settings-panel-btn">
                    <i class="fa-solid fa-arrows-left-right"></i> Reset Column Widths
                </button>
            </div>
        </div>


        <div class="table-container" id="table-view-container" style="display: flex; flex-direction: column;">
            <div id="table-wrap" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
                <div class="table-header-wrap">
                    <table id="data-table-header" style="table-layout:fixed; width:100%;">
                        <colgroup id="table-colgroup-header"></colgroup>
                        <thead id="table-head"></thead>
                    </table>
                </div>
                <div class="table-body-wrap" id="table-body-wrap">
                    <table id="data-table" style="table-layout:fixed; width:100%;">
                        <colgroup id="table-colgroup"></colgroup>
                        <tbody id="table-body"></tbody>
                    </table>
                    <div id="pagination-container" class="load-more-container"></div>
                </div>
            </div>
            <div id="loader">Loading...</div>

            <div id="graph-view-container"
                style="display:none; flex: 1; min-height: 400px; border:1px solid var(--border); background:#121212; border-radius:4px; overflow:hidden; margin: 10px; position:relative;">
                <div id="graph-loading-overlay">
                    <div class="spinner-graph"></div>
                    <div class="graph-loading-content">
                        <div id="graph-loading-text">Initializing Map...</div>
                        <div id="graph-stream-info"></div>
                    </div>
                </div>
                <div class="graph-settings"
                    style="position:absolute; top:15px; right:15px; z-index:100; background:rgba(18,18,18,0.8); padding:10px; border-radius:8px; border:1px solid var(--border); display:flex; flex-direction:column; gap:10px; backdrop-filter:blur(5px); width: 150px;">
                    <div class="graph-setting-item" style="align-items: center;">
                        <label style="margin-bottom: 5px;">Profile</label>
                        <div class="view-toggle" id="profile-toggle"
                            style="margin-left: 0; width: 100%; box-sizing: border-box; justify-content: space-around;">
                            <button class="view-btn active" onclick="window.graphInstance.applyProfile('default')"
                                data-profile="default" title="Default View">Def</button>
                            <button class="view-btn" onclick="window.graphInstance.applyProfile('func_tags')"
                                data-profile="func_tags" title="Func Tags View">Func</button>
                            <button class="view-btn" onclick="window.graphInstance.applyProfile('sim_tags')"
                                data-profile="sim_tags" title="Sim Tags View">Sim</button>
                        </div>
                    </div>
                    <div class="graph-setting-item">
                        <label>Show Label</label>
                        <select id="graph-show-label" onchange="window.graphInstance.refreshColors()">
                            <option value="none">None</option>
                            <option value="func_name">Function Name</option>
                            <option value="file_name">File Name</option>
                            <option value="func_tag">Function Tag</option>
                            <option value="file_tag">File Tag</option>
                        </select>
                    </div>

                    <div id="graph-more-options-toggle"
                        style="cursor:pointer; font-size:0.75rem; color:var(--accent); text-align:center; padding-top:5px; border-top:1px solid var(--border);"
                        onclick="const extra = document.getElementById('graph-extra-settings'); extra.style.display = extra.style.display === 'none' ? 'flex' : 'none'; this.innerText = extra.style.display === 'none' ? 'More options ▾' : 'Fewer options ▴';">
                        More options ▾
                    </div>

                    <div id="graph-extra-settings" style="display:none; flex-direction:column; gap:10px;">
                        <div class="graph-setting-item">
                            <label>Binary</label>
                            <select id="graph-color-binary" onchange="window.graphInstance.refreshColors()">
                                <option value="binary">Default</option>
                                <option value="file_tag">File Tag</option>
                            </select>
                        </div>
                        <div class="graph-setting-item">
                            <label>Function</label>
                            <select id="graph-color-function" onchange="window.graphInstance.refreshColors()">
                                <option value="binary">Default</option>
                                <option value="func_tag">Function Tag</option>
                                <option value="file_tag">File Tag</option>
                            </select>
                        </div>
                        <div class="graph-setting-item">
                            <label>Similarity</label>
                            <select id="graph-color-sim" onchange="window.graphInstance.refreshColors()">
                                <option value="gradient">Gradient Default</option>
                                <option value="sim_tag">Sim Tag</option>
                                <option value="func_tag">Gradient Func Tag</option>
                                <option value="file_tag">Gradient File Tag</option>
                            </select>
                        </div>
                        <div class="graph-setting-item">
                            <label>Tension</label>
                            <input type="range" id="graph-bundle-tension" min="0" max="1" step="0.05" value="0.85"
                                style="width:100%" oninput="window.graphInstance.refreshColors()">
                        </div>
                        <div class="graph-setting-item">
                            <label>Link Width</label>
                            <input type="range" id="graph-link-width" min="0.1" max="5" step="0.1" value="1.0"
                                style="width:100%" oninput="window.graphInstance.refreshColors()">
                        </div>
                        <div class="graph-setting-item" style="flex-direction:row; align-items:center; gap:8px;">
                            <input type="checkbox" id="graph-scale-width" checked
                                onchange="window.graphInstance.refreshColors()">
                            <label style="margin-bottom:0">Scale by Score</label>
                        </div>
                    </div>
                </div>
                <div id="bk-similarity-plot" style="width:100%; height:100%;"></div>
                <div class="graph-controls">

                    <button id="graph-stop-btn" class="btn-graph stop" style="display:none">Stop Load</button>
                </div>
            </div>

            <div id="hierarchy-view-container"
                style="display:none; flex: 1; min-height: 400px; border:1px solid var(--border); background:#0d0f14; border-radius:4px; overflow:hidden; margin: 10px; position:relative;">
            </div>

            <div id="packing-view-container"
                style="display:none; flex: 1; min-height: 400px; border:1px solid var(--border); background:#0d0f14; border-radius:4px; overflow:hidden; margin: 10px; position:relative;">
            </div>

            <div id="call-graph-view-container"
                style="display:none; flex: 1; min-height: 400px; border:1px solid var(--border); background:#0d0f14; border-radius:4px; overflow:hidden; margin: 10px; position:relative;">
            </div>

            <div id="upload-view-container"
                style="display:none; flex: 1; min-height: 400px; border:1px solid var(--border); background:#0d0f14; border-radius:4px; overflow-y:auto; margin: 10px; position:relative; padding: 30px;">
            </div>

            <div id="binary-similarity-container"
                style="display:none; flex: 1; flex-direction:column; min-height: 400px; border:1px solid var(--border); background:#0d0f14; border-radius:4px; overflow-y:auto; margin: 10px; position:relative;">
            </div>

            <div id="chord-view-container"
                style="display:none; flex: 1; min-height: 400px; border:1px solid var(--border); background:#0d0f14; border-radius:4px; overflow:hidden; margin: 10px; position:relative;">
            </div>

        </div>
    </main>

    <!-- Extracted script block 1 -->

    <div id="code-preview-tooltip"></div>
    <div id="token-tooltip"></div>
    <div id="diff-preview-tooltip"></div>
    <div id="hierarchy-tooltip"
        style="position:fixed; z-index:20003; background:rgba(13,15,20,0.98); border-radius:8px; border:1px solid var(--accent); display:none; pointer-events:auto; font-size:0.8rem; box-shadow:0 15px 50px rgba(0,0,0,0.9); max-width:none; backdrop-filter:blur(15px); overflow:hidden;">
    </div>


    <div id="collection-flyout">
        <div id="collection-flyout-list"></div>
    </div>

    <div id="window-tray"></div>
    <div id="notification-container"
        style="position: fixed; bottom: 60px; right: 20px; z-index: 100000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;">
    </div>


    <!-- Extracted script block 2 -->
    <div id="job-details-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width: 800px; width: 90%;">
            <div class="modal-header">
                <h3 id="job-modal-title">Job Details</h3>
                <button class="close-btn" onclick="closeJobModal()">&times;</button>
            </div>
            <div id="job-modal-body" class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn-action" onclick="closeJobModal()">Close</button>
            </div>
        </div>
    </div>
</body>

</html>
