services:
  redis:
    image: redis:latest
    container_name: ${PROJECT_NAME}_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: always

  kvrocks:
    image: apache/kvrocks:latest
    container_name: ${PROJECT_NAME}_kvrocks
    ports:
      - "${KVROCKS_PORT:-6666}:6666"
    volumes:
      - ./kvrocks_data:/var/lib/kvrocks
      - ./kvrocks.conf:/var/lib/kvrocks/kvrocks.conf:ro
    command: [ "--bind", "0.0.0.0", "--dir", "/var/lib/kvrocks" ]
    deploy:
      resources:
        limits:
          memory: 8G
    restart: always
