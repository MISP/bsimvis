services:
  redis:
    image: redis:latest
    container_name: ${PROJECT_NAME}_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: always

  kvrocks:
    image: apache/kvrocks:latest
    container_name: ${PROJECT_NAME}_kvrocks
    ports:
      - "${KVROCKS_PORT:-6666}:6666"
    volumes:
      - ./data/kvrocks:/var/lib/kvrocks
      - ./kvrocks.conf:/var/lib/kvrocks/kvrocks.conf:ro
    command: [ "--bind", "0.0.0.0", "--dir", "/var/lib/kvrocks" ]
    deploy:
      resources:
        limits:
          memory: 8G
    restart: always

  etcd:
    profiles:
      - milvus
    container_name: ${PROJECT_NAME}_milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "${ETCD_PORT:-2379}:2379"
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    profiles:
      - milvus
    container_name: ${PROJECT_NAME}_milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - ./data/minio:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    profiles:
      - milvus
    container_name: ${PROJECT_NAME}_milvus-standalone
    image: milvusdb/milvus:v2.4.15
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./data/milvus:/var/lib/milvus
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_PORT:-9091}:9091"
    depends_on:
      - "etcd"
      - "minio"
