# Lightweight datastores for DOCKER_DATASTORES=true (see launch_tmux.sh).
# Both run as the host user so the bind-mounted data dirs stay writable, and
# publish on 127.0.0.1 only: neither has a password.
services:
  redis:
    image: redis:7.2
    container_name: ${PROJECT_NAME}_redis
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ${DATA_BASE_DIR:-./data}/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kvrocks:
    image: apache/kvrocks:2.17.0
    container_name: ${PROJECT_NAME}_kvrocks
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "127.0.0.1:${KVROCKS_PORT:-6666}:6666"
    volumes:
      - ${DATA_BASE_DIR:-./data}/kvrocks:/var/lib/kvrocks
      - ./kvrocks.conf:/etc/kvrocks/kvrocks.conf:ro
    # Appended to the image entrypoint; the last -c and later flags win.
    # The default pidfile dir is only writable by the image's uid 999.
    command:
      - "-c"
      - "/etc/kvrocks/kvrocks.conf"
      - "--pidfile"
      - "/var/lib/kvrocks/kvrocks.pid"
      - "--rocksdb.block_cache_size"
      - "${KVROCKS_BLOCK_CACHE_MB:-1024}"
      - "--rocksdb.max_background_jobs"
      - "2"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -p 6666 PING | grep -E '(PONG|NOAUTH)'" ]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${KVROCKS_MEMORY_LIMIT:-3G}
    restart: unless-stopped

  etcd:
    profiles:
      - milvus
    container_name: ${PROJECT_NAME}_milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "${ETCD_PORT:-2379}:2379"
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    profiles:
      - milvus
    container_name: ${PROJECT_NAME}_milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - ./data/minio:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    profiles:
      - milvus
    container_name: ${PROJECT_NAME}_milvus-standalone
    image: milvusdb/milvus:v2.4.15
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./data/milvus:/var/lib/milvus
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_PORT:-9091}:9091"
    depends_on:
      - "etcd"
      - "minio"
