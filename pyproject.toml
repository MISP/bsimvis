[project]
name = "bsimvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=26.3.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "flask-restx>=1.3.0",
    "pyghidra>=3.0.2",
    "python-dotenv>=1.2.2",
    "redis>=7.3.0",
    "requests>=2.33.1",
    "tqdm>=4.67.3",
    "pymilvus>=2.4.0",
    "hdbscan>=0.8.40",
    "scikit-learn>=1.6.0",
]

[project.scripts]
bsimvis = "bsimvis.cli.main:main"
bsimvis-bench = "bsimvis.cli.bsimvis_bench:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["bsimvis"]
